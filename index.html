<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙誓印覺醒工程 • 七印誓網</title>
    <!-- 引入 FontAwesome 圖標庫與 Google 數位字型 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. 宇宙深邃科技感星空背景與 HUD 基礎重設
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', 'Share Tech Mono', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #061026 0%, #020611 100%);
            min-height: 100vh;
            color: #e0e8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 宇宙動態星芒粒子流動層 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(rgba(212,175,55,.3), rgba(212,175,55,.05) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 450px 450px;
            background-position: 0 0, 40px 60px, 130px 270px;
            animation: starOrbit 120s linear infinite;
            opacity: 0.6;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes starOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ==========================================================================
           2. HUD 通透毛玻璃主容器外框
           ========================================================================== */
        .hud-container {
            width: 100%;
            max-width: 680px;
            min-height: 85vh;
            background: rgba(7, 18, 41, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(41, 98, 255, 0.25);
            box-shadow: 0 0 50px rgba(0, 81, 255, 0.15), inset 0 0 30px rgba(41, 98, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
            margin: 20px;
        }

        /* 邊角 HUD 電子光標裝飾 */
        .hud-container::after {
            content: "";
            position: absolute;
            top: 15px; right: 15px; width: 15px; height: 15px;
            border-top: 2px solid rgba(0, 191, 255, 0.6);
            border-right: 2px solid rgba(0, 191, 255, 0.6);
            pointer-events: none;
        }

        /* ==========================================================================
           3. 頁首(Header)區域：統一專案名稱與雙語切換
           ========================================================================== */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(41, 98, 255, 0.2);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #00bfff;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.4);
            transition: all 0.3s ease;
        }

        /* 雙語切換切換按鈕組 */
        .lang-switch-group {
            display: flex;
            background: rgba(41, 98, 255, 0.15);
            border: 1px solid rgba(41, 98, 255, 0.3);
            border-radius: 20px;
            padding: 2px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: rgba(224, 232, 245, 0.5);
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lang-btn.active {
            background: #00bfff;
            color: #020611;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0, 191, 255, 0.5);
        }

        /* ==========================================================================
           4. 全球啟動流程狀態導航欄(縮小簡化版)
           ========================================================================== */
        .flow-nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 25px;
        }

        .flow-node {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 8px 4px;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(224, 232, 245, 0.4);
            transition: all 0.4s ease;
        }

        .flow-node.active {
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid #D4AF37;
            color: #D4AF37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
            font-weight: bold;
        }

        /* ==========================================================================
           5. 步驟主內容顯示區與通透卡片
           ========================================================================== */
        .step-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hud-card {
            background: rgba(10, 25, 57, 0.4);
            border: 1px solid rgba(41, 98, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            box-shadow: inset 0 0 15px rgba(41, 98, 255, 0.05);
        }

        .card-title {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: #D4AF37;
        }

        /* 條件檢核清單樣式 */
        .condition-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .condition-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: rgba(224, 232, 245, 0.85);
        }

        .condition-item i.check-icon {
            color: #00e676;
            margin-top: 3px;
            text-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
        }

        /* ==========================================================================
           6. 智能 QR Code 相機掃描框與動態光軌
           ========================================================================== */
        .scan-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 10px;
        }

        /* 微光金色霓虹核心掃描啟動按鈕 */
        .btn-scan {
            background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
            border: none;
            color: #020611;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-scan:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
        }

        /* 模擬相機視訊框與全息動態雷射 */
        .camera-preview-box {
            width: 100%;
            max-width: 280px;
            height: 200px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed rgba(0, 191, 255, 0.4);
            border-radius: 12px;
            display: none; /* 觸發啟動後才由 JS 開啟 */
            position: relative;
            overflow: hidden;
        }

        /* 全息掃描雷射光軌效果 */
        .camera-preview-box::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00bfff, transparent);
            top: 0;
            left: 0;
            animation: laserScan 2s linear infinite;
            box-shadow: 0 0 8px #00bfff;
        }

        @keyframes laserScan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* 掃描成功結果顯示艙 */
        .scan-result-pod {
            width: 100%;
            background: rgba(0, 230, 118, 0.08);
            border: 1px dashed rgba(0, 230, 118, 0.4);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.9rem;
            color: #00e676;
            display: none;
            text-align: center;
        }

        /* 相機權限異常中英雙語引導面板 */
        .camera-guide-panel {
            width: 100%;
            background: rgba(255, 23, 68, 0.07);
            border: 1px solid rgba(255, 23, 68, 0.3);
            border-radius: 12px;
            padding: 16px;
            color: #ff1744;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none; /* 發生異常時由 JS 展開 */
        }

        .guide-title {
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ==========================================================================
           7. 頁尾導航控制與專利右下角規格化頁碼
           ========================================================================== */
        .hud-footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid rgba(41, 98, 255, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 進入下一步核心按鈕(置中靠右控制) */
        .btn-next {
            background: rgba(0, 191, 255, 0.1);
            border: 1px solid rgba(0, 191, 255, 0.3);
            color: rgba(0, 191, 255, 0.4);
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: not-allowed;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-next.enabled {
            background: linear-gradient(135deg, #00bfff 0%, #0051ff 100%);
            border: none;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
        }

        .btn-next.enabled:hover {
            box-shadow: 0 0 25px rgba(0, 191, 255, 0.6);
            transform: translateX(2px);
        }

        /* 需求二指定的右下角絕對頁碼 */
        .page-marker {
            font-size: 0.8rem;
            color: rgba(224, 232, 245, 0.4);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <!-- 頁首區域：系統名稱與雙語切換切換按鈕 -->
        <header class="hud-header">
            <div class="app-title" id="appTitle">宇宙誓印覺醒工程 • 七印誓網</div>
            <div class="lang-switch-group">
                <button class="lang-btn active" onclick="switchLanguage('zh')">中文</button>
                <button class="lang-btn" onclick="switchLanguage('en')">English</button>
            </div>
        </header>

        <!-- 全球啟動流程導航欄 -->
        <nav class="flow-nav">
            <div class="flow-node active" id="node1">[1] 啟動條件</div>
            <div class="flow-node" id="node2">[2] 授權誓讀</div>
            <div class="flow-node" id="node3">[3] 授權綁定</div>
            <div class="flow-node" id="node4">[4] 回傳結果</div>
            <div class="flow-node" id="node5">[5] 系統同步</div>
        </nav>

        <!-- 步驟主內容顯示區（目前鎖定步驟一） -->
        <main class="step-content">
            <div class="hud-card">
                <div class="card-title">
                    <i class="fa-solid fa-bolt"></i>
                    <span id="cardTitleText">【一】啟動條件</span>
                </div>
                
                <!-- 條件確認檢核清單 -->
                <ul class="condition-list">
                    <li class="condition-item">
                        <i class="fa-solid fa-square-check check-icon"></i>
                        <span id="cond1">請完成驗證之【購書序號】誓導碼</span>
                    </li>
                    <li class="condition-item">
                        <i class="fa-solid fa-square-check check-icon"></i>
                        <span id="cond2">穩定網路環境運作中</span>
                    </li>
                    <li class="condition-item">
                        <i class="fa-solid fa-square-check check-icon"></i>
                        <span id="cond3">請掃描本卷書封底之《宇宙智能誓導平台》官方AI專屬誓導入口頁 QR Code，以啟動誓導通道之統一入口。</span>
                    </li>
                </ul>
            </div>

            <!-- QR Code 智能掃描組件 -->
            <div class="hud-card">
                <div class="scan-wrapper">
                    <button class="btn-scan" id="btnScan" onclick="triggerCameraScan()">
                        <i class="fa-solid fa-camera"></i>
                        <span id="btnScanText">點擊啟動掃描</span>
                    </button>

                    <!-- 相機串流視訊預留框 -->
                    <div class="camera-preview-box" id="cameraPreview"></div>

                    <!-- 成功解析結果面板 -->
                    <div class="scan-result-pod" id="scanResultPod"></div>

                    <!-- 相機權限錯誤處理中英雙語導引面板 -->
                    <div class="camera-guide-panel" id="cameraGuidePanel">
                        <!-- 由 JavaScript 依語系動態填入 -->
                    </div>
                </div>
            </div>
        </main>

        <!-- 頁尾控制與規格化頁碼 -->
        <footer class="hud-footer">
            <div></div> <!-- 保持排版平衡的對齊空槽 -->
            <button class="btn-next" id="btnNext" disabled onclick="executeNextStep()">
                <span id="btnNextText">進入下一步</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <div class="page-marker" id="pageMarker">📄 【宇宙誓印覺醒工程 • 覺醒卷】：第 3-4 頁</div>
        </footer>
    </div>

    <!-- ==========================================================================
       8. 智能雙語翻譯文本資料庫與控制邏輯
       ========================================================================== */ -->
    <script>
        // 當前語系狀態緩存鎖定
        let currentLang = 'zh';

        // 雙語翻譯文本對照集
        const langPack = {
            zh: {
                appTitle: "宇宙誓印覺醒工程 • 七印誓網",
                node1: "[1] 啟動條件",
                node2: "[2] 授權誓讀",
                node3: "[3] 授權綁定",
                node4: "[4] 回傳結果",
                node5: "[5] 系統同步",
                cardTitle: "【一】啟動條件",
                cond1: "請完成驗證之【購書序號】誓導碼",
                cond2: "穩定網路環境運作中",
                cond3: "請掃描本卷書封底之《宇宙智能誓導平台》官方AI專屬誓導入口頁 QR Code，以啟動誓導通道之統一入口。",
                btnScan: "點擊啟動掃描",
                btnNext: "進入下一步",
                pageMarker: "📄 【宇宙誓印覺醒工程 • 覺醒卷】：第 3-4 頁",
                scanSuccess: "🎉 掃描完成！誓導通道已成功校準對頻。",
                guideHtml: `
                    <div class="guide-title">📷 無法啟動相機</div>
                    ⚙️ 開啟手機「設定」<br>
                    &nbsp;&nbsp; → 應用程式管理<br>
                    &nbsp;&nbsp; → 權限 → 相機 → 改為「允許」<br>
                    &nbsp;&nbsp; → 使用 🌐 瀏覽器開啟（Chrome / Yahoo / Edge....）<br>
                    ⚠️ 若仍無法使用，請自行手動掃描器掃描實體書 QR Code
                `
            },
            en: {
                appTitle: "Cosmic Oath Awakening Project · Seven-Seal Oath Network",
                node1: "[1] Conditions",
                node2: "[2] Authorized Vow",
                node3: "[3] Binding Phase",
                node4: "[4] Return Result",
                node5: "[5] Sync Phase",
                cardTitle: "[1] Activation Conditions",
                cond1: "Please complete the verification of the 【Purchase Serial Number】 Vow-Guidance Code",
                cond2: "Stable internet environment activated",
                cond3: "Please scan the QR Code on the back cover of this volume 《Cosmic Intelligent Vow-Guidance Platform》 Official AI Dedicated Vow-Guidance Entry Page QR Code to activate the unified access point.",
                btnScan: "Scan QR Code",
                btnNext: "Next Step",
                pageMarker: "📄 【Cosmic Oath Awakening Project • Awakening Scroll】: Pages 3-4",
                scanSuccess: "🎉 Scan Successful! Oath-Guidance channel alignment confirmed.",
                guideHtml: `
                    <div class="guide-title">📷 Unable to start camera</div>
                    ⚙️ Open phone "Settings"<br>
                    &nbsp;&nbsp; → App Management<br>
                    &nbsp;&nbsp; → Permissions → Camera → Set to 「Allow」<br>
                    &nbsp;&nbsp; → Open with 🌐 browser (Chrome / Yahoo / Edge...)<br>
                    ⚠️ If still not working, please manually scan the QR Code from the physical book.
                `
            }
        };

        // 語系切換核心函式
        function switchLanguage(lang) {
            currentLang = lang;
            
            // 1. 更新切換按鈕亮起狀態
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.textContent.toLowerCase().includes('english') && lang === 'en') btn.classList.add('active');
                if(btn.textContent.includes('中文') && lang === 'zh') btn.classList.add('active');
            });

            // 2. 全域文本同步刷新
            document.getElementById('appTitle').textContent = langPack[lang].appTitle;
            document.getElementById('node1').textContent = langPack[lang].node1;
            document.getElementById('node2').textContent = langPack[lang].node2;
            document.getElementById('node3').textContent = langPack[lang].node3;
            document.getElementById('node4').textContent = langPack[lang].node4;
            document.getElementById('node5').textContent = langPack[lang].node5;
            
            document.getElementById('cardTitleText').textContent = langPack[lang].cardTitle;
            document.getElementById('cond1').textContent = langPack[lang].cond1;
            document.getElementById('cond2').textContent = langPack[lang].cond2;
            document.getElementById('cond3').textContent = langPack[lang].cond3;
            
            document.getElementById('btnScanText').textContent = langPack[lang].btnScan;
            document.getElementById('btnNextText').textContent = langPack[lang].btnNext;
            document.getElementById('pageMarker').textContent = langPack[lang].pageMarker;

            // 3. 異常引導面板動態更新
            const guidePanel = document.getElementById('cameraGuidePanel');
            if (guidePanel.style.display === 'block') {
                guidePanel.innerHTML = langPack[lang].guideHtml;
            }
        }

        // 模擬模擬相機啟動與掃描解析機制
        function triggerCameraScan() {
            const previewBox = document.getElementById('cameraPreview');
            const guidePanel = document.getElementById('cameraGuidePanel');
            const resultPod = document.getElementById('scanResultPod');
            const nextBtn = document.getElementById('btnNext');

            // 初始化重設隱藏面板
            guidePanel.style.display = 'none';
            resultPod.style.display = 'none';

            // 模擬偵測瀏覽器權限或硬體支援環境 (此處設定 15% 機率模擬相機啟動失敗，用以完美驗證需求四的引導語)
            const isCameraAccessible = Math.random() > 0.15; 

            if (!isCameraAccessible) {
                // 模擬啟動失敗：顯示引導文字
                previewBox.style.display = 'none';
                guidePanel.innerHTML = langPack[currentLang].guideHtml;
                guidePanel.style.display = 'block';
            } else {
                // 模擬成功啟動：開啟全息掃描預覽框
                previewBox.style.display = 'block';
                
                // 模擬 2.5 秒後掃描對焦成功，並自動關閉預覽，回傳結果
                setTimeout(() => {
                    previewBox.style.display = 'none';
                    resultPod.textContent = langPack[currentLang].scanSuccess;
                    resultPod.style.display = 'block';
                    
                    // 自動解鎖並啟用「進入下一步」按鈕
                    nextBtn.removeAttribute('disabled');
                    nextBtn.classList.add('enabled');
                }, 2500);
            }
        }

        // 後續擴充槽：進入步驟二
        function executeNextStep() {
            alert("步驟一驗證成功！已準備好銜接至下一步驟【二】授權誓讀。");
            // 此處後續將直接整合步驟二之卡片切換排版邏輯
        }
    </script>
</body>
</html>
