    <script>
        // ============================================================
        // 計時器全域變數
        // ============================================================
        let timerInterval = null;
        let timerRunning = false;
        let timerDone = false;
        let timerCountdown = 10;

        // ============================================================
        // QR 掃描器管理
        // ============================================================
        const scanners = {};

        function showCameraFailNotice(step) {
            const notice = document.getElementById('cameraFailNotice' + step);
            if (notice) notice.style.display = 'block';
        }

        function hideCameraFailNotice(step) {
            const notice = document.getElementById('cameraFailNotice' + step);
            if (notice) notice.style.display = 'none';
        }

        function onScanSuccess(step, decodedText) {
            const resultDiv = document.getElementById('scanResult' + step);
            const contentDiv = document.getElementById('scanContent' + step);
            const statusDiv = document.getElementById('scannerStatus' + step);

            if (resultDiv) {
                resultDiv.style.display = 'block';
                contentDiv.textContent = decodedText;
            }
            if (statusDiv) {
                statusDiv.textContent = '✅ 掃描成功！';
                statusDiv.className = 'scanner-status success';
            }

            stopScanner(step);
            if (navigator.vibrate) navigator.vibrate(200);
            localStorage.setItem('scan_result_' + step, decodedText);
            hideCameraFailNotice(step);
        }

        function startScanner(step) {
            const readerId = 'reader' + step;
            const scannerContainer = document.getElementById('scanner' + step);
            const scanBtn = document.getElementById('scanBtn' + step);
            const stopBtn = document.getElementById('stopBtn' + step);
            const statusDiv = document.getElementById('scannerStatus' + step);

            if (scanners[step] && scanners[step].isRunning) return;

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                if (statusDiv) {
                    statusDiv.textContent = '❌ 瀏覽器不支援相機，請自行手動掃描器掃描實體書 QR Code';
                    statusDiv.className = 'scanner-status error';
                }
                showCameraFailNotice(step);
                return;
            }

            if (scannerContainer) scannerContainer.classList.remove('scanner-hidden');
            if (scanBtn) { scanBtn.disabled = true;
                scanBtn.textContent = '⏳ 啟動中...'; }
            if (stopBtn) stopBtn.style.display = 'block';
            hideCameraFailNotice(step);

            if (statusDiv) {
                statusDiv.textContent = '⏳ 正在啟動相機，請允許權限...';
                statusDiv.className = 'scanner-status';
            }

            const html5QrCode = new Html5Qrcode(readerId);
            const config = {
                fps: 15,
                qrbox: { width: 200, height: 200 },
                aspectRatio: 1.0
            };
            if (window.innerWidth < 440) config.qrbox = { width: 150, height: 150 };
            if (window.innerWidth < 360) config.qrbox = { width: 120, height: 120 };

            html5QrCode.start({ facingMode: "environment" },
                config,
                (decodedText) => { onScanSuccess(step, decodedText); },
                (error) => {}
            ).then(() => {
                scanners[step] = { instance: html5QrCode, isRunning: true };
                if (statusDiv) {
                    statusDiv.textContent = '📷 請將 QR Code 放入框內掃描';
                    statusDiv.className = 'scanner-status';
                }
                if (scanBtn) { scanBtn.disabled = false;
                    scanBtn.textContent = '📸 掃描 QR Code'; }
            }).catch((err) => {
                console.error('啟動掃描器失敗:', err);
                let errorMsg = '❌ 無法啟動相機';
                if (err.message && err.message.includes('Permission')) {
                    errorMsg = '無法啟動相機，請自行手動掃描器掃描實體書 QR Code';
                } else if (err.message) {
                    errorMsg = '❌ ' + err.message.substring(0, 50);
                }
                if (statusDiv) {
                    statusDiv.textContent = errorMsg;
                    statusDiv.className = 'scanner-status error';
                }
                if (scanBtn) { scanBtn.disabled = false;
                    scanBtn.textContent = '📸 掃描 QR Code'; }
                if (scannerContainer) scannerContainer.classList.add('scanner-hidden');
                if (stopBtn) stopBtn.style.display = 'none';
                showCameraFailNotice(step);
            });
        }

        function stopScanner(step) {
            const scannerContainer = document.getElementById('scanner' + step);
            const scanBtn = document.getElementById('scanBtn' + step);
            const stopBtn = document.getElementById('stopBtn' + step);
            const statusDiv = document.getElementById('scannerStatus' + step);

            if (scanners[step] && scanners[step].isRunning) {
                try {
                    scanners[step].instance.stop().then(() => {
                        scanners[step].isRunning = false;
                        if (scannerContainer) scannerContainer.classList.add('scanner-hidden');
                        if (scanBtn) { scanBtn.disabled = false;
                            scanBtn.textContent = '📸 掃描 QR Code'; }
                        if (stopBtn) stopBtn.style.display = 'none';
                        if (statusDiv && !statusDiv.textContent.includes('成功')) {
                            statusDiv.textContent = '📱 點擊下方按鈕開啟掃描器';
                            statusDiv.className = 'scanner-status';
                        }
                    }).catch((err) => { console.warn('停止掃描器時出錯:', err); });
                } catch (e) { console.warn('停止掃描器異常:', e); }
            } else {
                if (scannerContainer) scannerContainer.classList.add('scanner-hidden');
                if (scanBtn) { scanBtn.disabled = false;
                    scanBtn.textContent = '📸 掃描 QR Code'; }
                if (stopBtn) stopBtn.style.display = 'none';
            }
        }

        // ============================================================
        // 計時器函數
        // ============================================================
        function startTimer() {
            if (timerRunning || timerDone) return;

            const lang = currentLang || 'zh';
            const t = texts[lang];

            timerRunning = true;
            timerDone = false;
            timerCountdown = 10;

            const displayEl = document.getElementById('timerDisplay');
            const statusEl = document.getElementById('timerStatus');
            const startBtn = document.getElementById('timerStartBtn');
            const resetBtn = document.getElementById('timerResetBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (displayEl) displayEl.textContent = '10';
            if (displayEl) displayEl.className = 'timer-number';
            if (statusEl) statusEl.textContent = '請靜心誦讀或默念誓文...';
            if (startBtn) { startBtn.disabled = true;
                startBtn.textContent = '誦讀中...'; }
            if (resetBtn) resetBtn.style.display = 'none';
            if (nextBtn) nextBtn.disabled = true;

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timerCountdown -= 1;
                if (timerCountdown <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timerRunning = false;
                    timerDone = true;
                    if (displayEl) {
                        displayEl.textContent = '0';
                        displayEl.className = 'timer-number done';
                    }
                    if (statusEl) statusEl.textContent = '✅ 已完成誦讀';
                    if (startBtn) { startBtn.disabled = false;
                        startBtn.textContent = '開始靜心'; }
                    if (resetBtn) resetBtn.style.display = 'inline-block';
                    if (nextBtn) nextBtn.disabled = false;
                    localStorage.setItem('oath_timer_done', 'true');
                    localStorage.setItem('step_completed_2', 'true');
                } else {
                    if (displayEl) displayEl.textContent = timerCountdown;
                }
            }, 1000);
        }

        function resetTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerRunning = false;
            timerDone = false;
            timerCountdown = 10;

            const displayEl = document.getElementById('timerDisplay');
            const statusEl = document.getElementById('timerStatus');
            const startBtn = document.getElementById('timerStartBtn');
            const resetBtn = document.getElementById('timerResetBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (displayEl) {
                displayEl.textContent = '10';
                displayEl.className = 'timer-number';
            }
            if (statusEl) {
                const lang = currentLang || 'zh';
                statusEl.textContent = texts[lang].timerStatusReady || '⏳ 準備開始';
            }
            if (startBtn) { startBtn.disabled = false;
                startBtn.textContent = '開始靜心'; }
            if (resetBtn) resetBtn.style.display = 'none';
            if (nextBtn) nextBtn.disabled = true;
            localStorage.removeItem('oath_timer_done');
        }

        // ============================================================
        // 頁面切換
        // ============================================================
        function goHome() {
            document.getElementById('pageHome').classList.remove('hidden');
            document.getElementById('pageSteps').classList.remove('show');
            document.getElementById('pageSteps').style.display = 'none';
            document.getElementById('backHomeBtn').classList.remove('show');

            resetTimer();
            updateStepStatus();
        }

        function goToStep(step) {
            document.getElementById('pageHome').classList.add('hidden');
            document.getElementById('pageSteps').style.display = 'block';
            document.getElementById('pageSteps').classList.add('show');
            document.getElementById('backHomeBtn').classList.add('show');

            resetTimer();

            currentStep = step;
            renderStep(currentStep);

            if (currentStep === 2) {
                const saved = localStorage.getItem('oath_timer_done');
                if (saved === 'true') {
                    timerDone = true;
                    timerRunning = false;
                    const lang = currentLang || 'zh';
                    const t = texts[lang];
                    const displayEl = document.getElementById('timerDisplay');
                    const statusEl = document.getElementById('timerStatus');
                    const startBtn = document.getElementById('timerStartBtn');
                    const resetBtn = document.getElementById('timerResetBtn');
                    const nextBtn = document.getElementById('nextBtn');
                    if (displayEl) {
                        displayEl.textContent = '0';
                        displayEl.className = 'timer-number done';
                    }
                    if (statusEl) statusEl.textContent = '✅ 已完成誦讀';
                    if (startBtn) { startBtn.disabled = false;
                        startBtn.textContent = '開始靜心'; }
                    if (resetBtn) resetBtn.style.display = 'inline-block';
                    if (nextBtn) nextBtn.disabled = false;
                }
            }
        }

        // ============================================================
        // 全域變數
        // ============================================================
        const totalSteps = 6;
        let currentStep = 1;
        let currentLang = 'zh';

        const $ = id => document.getElementById(id);

        // ============================================================
        // 語言切換
        // ============================================================
        function switchLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));

            const isHome = !document.getElementById('pageHome').classList.contains('hidden');
            if (isHome) {
                renderHome();
            } else {
                renderStep(currentStep);
                updateTimerText();
            }
        }

        function updateTimerText() {
            const lang = currentLang || 'zh';
            const t = texts[lang];
            const statusEl = document.getElementById('timerStatus');
            const labelEl = document.getElementById('timerLabel');
            const startBtn = document.getElementById('timerStartBtn');

            if (labelEl) labelEl.textContent = t.timerLabel || '請靜心誦讀 10 秒';

            if (timerDone) {
                if (statusEl) statusEl.textContent = t.timerStatusDone || '✅ 已完成誦讀';
                if (startBtn) startBtn.textContent = '開始靜心';
            } else if (timerRunning) {
                if (statusEl) statusEl.textContent = t.timerStatusRunning || '請靜心誦讀或默念誓文...';
                if (startBtn) startBtn.textContent = '誦讀中...';
            } else {
                if (statusEl) statusEl.textContent = t.timerStatusReady || '⏳ 準備開始';
                if (startBtn) startBtn.textContent = '開始靜心';
            }
        }

        // ============================================================
        // 渲染目錄首頁
        // ============================================================
        function renderHome() {
            const t = texts[currentLang];
            document.getElementById('backHomeText').textContent = t.backHome;
            document.getElementById('appTitle').textContent = t.appTitle;
            document.getElementById('appSubtitle').textContent = t.appSubtitle;
            document.getElementById('subInfo').textContent = t.subInfo;
            document.getElementById('btnStart').textContent = t.btnStart;
            document.getElementById('stepLabel1').textContent = t.step1;
            document.getElementById('stepLabel2').textContent = t.step2;
            document.getElementById('stepLabel3').textContent = t.step3;
            document.getElementById('stepLabel4').textContent = t.step4;
            document.getElementById('stepLabel5').textContent = t.step5;
            document.getElementById('pageFooter').innerHTML = t.footer;
            updateStepStatus();
        }

        // ============================================================
        // 更新步驟狀態
        // ============================================================
        function updateStepStatus() {
            for (let i = 1; i <= 5; i++) {
                const statusEl = document.getElementById('status' + i);
                const stepItem = document.querySelector(`.step-item[data-step="${i}"]`);
                if (statusEl) {
                    const completed = localStorage.getItem('step_completed_' + i);
                    if (completed === 'true') {
                        statusEl.textContent = '✅';
                        if (stepItem) stepItem.classList.add('active');
                    } else {
                        statusEl.textContent = '⬜';
                        if (stepItem) stepItem.classList.remove('active');
                    }
                }
            }
        }

        // ============================================================
        // 渲染步驟
        // ============================================================
        function renderStep(step) {
            const t = texts[currentLang];
            const isComplete = (step === totalSteps);

            document.getElementById('backHomeText').textContent = t.backHome;
            document.getElementById('appTitle').textContent = t.appTitle;
            document.getElementById('appSubtitle').textContent = t.appSubtitle;

            document.querySelectorAll('.step-page').forEach((page) => {
                const pageStep = parseInt(page.dataset.step);
                page.classList.toggle('active', pageStep === step || (isComplete && pageStep === totalSteps));
            });

            const stepButtons = document.getElementById('stepButtons');
            if (isComplete) {
                document.getElementById('completeDesc').innerHTML = t.completeDesc;
                if (stepButtons) stepButtons.style.display = 'none';
                return;
            } else {
                if (stepButtons) stepButtons.style.display = 'flex';
            }

            document.getElementById('prevBtn').style.display = 'inline-block';
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.className = 'btn btn-next';

            if (step === totalSteps - 1) {
                nextBtn.textContent = '🔥 正式啟動 🔥';
                nextBtn.className = 'btn btn-finish';
            } else {
                nextBtn.textContent = t.btnNext;
                nextBtn.className = 'btn btn-next';
            }

            document.getElementById('prevBtn').disabled = (step === 1);

            switch (step) {
                case 1:
                    document.getElementById('s1Title').textContent = t.s1Title;
                    document.getElementById('s1Sub').textContent = t.s1Sub;
                    document.getElementById('s1Card1Title').textContent = t.s1Card1Title;
                    document.getElementById('s1Card1Text').innerHTML = t.s1Card1Text;
                    document.getElementById('s1Card2Title').textContent = t.s1Card2Title;
                    document.getElementById('s1Card2Text').innerHTML = t.s1Card2Text;
                    document.getElementById('s1Footer').textContent = t.s1Footer;
                    break;
                case 2:
                    document.getElementById('s2Title').textContent = t.s2Title;
                    document.getElementById('s2Sub').textContent = t.s2Sub;
                    const oathEl = document.getElementById('oathDeclare');
                    if (currentLang === 'zh') {
                        oathEl.className = 'oath-declaration';
                        oathEl.textContent = t.oathDeclare;
                    } else {
                        oathEl.className = 'oath-declaration-en';
                        oathEl.textContent = t.oathDeclare;
                    }
                    document.getElementById('timerLabel').textContent = t.timerLabel;
                    document.getElementById('s2CardTitle').textContent = t.s2CardTitle;
                    document.getElementById('s2CardText').textContent = t.s2CardText;
                    document.getElementById('s2Footer').textContent = t.s2Footer;

                    const startBtn = document.getElementById('timerStartBtn');
                    const resetBtn = document.getElementById('timerResetBtn');

                    if (!timerDone) {
                        if (!timerRunning && timerCountdown === 10) {
                            document.getElementById('timerStatus').textContent = t.timerStatusReady;
                            document.getElementById('timerDisplay').textContent = '10';
                            document.getElementById('timerDisplay').className = 'timer-number';
                            if (startBtn) { startBtn.disabled = false;
                                startBtn.textContent = '開始靜心'; }
                            if (resetBtn) resetBtn.style.display = 'none';
                            nextBtn.disabled = true;
                        } else if (timerRunning) {
                            document.getElementById('timerStatus').textContent = t.timerStatusRunning;
                            document.getElementById('timerDisplay').textContent = timerCountdown;
                            document.getElementById('timerDisplay').className = 'timer-number';
                            if (startBtn) { startBtn.disabled = true;
                                startBtn.textContent = '誦讀中...'; }
                            if (resetBtn) resetBtn.style.display = 'none';
                            nextBtn.disabled = true;
                        }
                    } else {
                        document.getElementById('timerStatus').textContent = t.timerStatusDone;
                        document.getElementById('timerDisplay').textContent = '0';
                        document.getElementById('timerDisplay').className = 'timer-number done';
                        if (startBtn) { startBtn.disabled = false;
                            startBtn.textContent = '開始靜心'; }
                        if (resetBtn) resetBtn.style.display = 'inline-block';
                        nextBtn.disabled = false;
                    }
                    break;
                case 3:
                    document.getElementById('s3Title').textContent = t.s3Title;
                    document.getElementById('s3Sub').textContent = t.s3Sub;
                    document.getElementById('s3Card1Title').textContent = t.s3Card1Title;
                    document.getElementById('s3Card1Text').textContent = t.s3Card1Text;
                    document.getElementById('s3Card2Title').textContent = t.s3Card2Title;
                    document.getElementById('s3Card2Text').textContent = t.s3Card2Text;
                    document.getElementById('s3Card3Title').textContent = t.s3Card3Title;
                    document.getElementById('s3Card3Text').innerHTML = t.s3Card3Text;
                    document.getElementById('s3Footer').textContent = t.s3Footer;
                    break;
                case 4:
                    document.getElementById('s4Title').textContent = t.s4Title;
                    document.getElementById('s4Sub').textContent = t.s4Sub;
                    document.getElementById('s4Card1Title').textContent = t.s4Card1Title;
                    document.getElementById('s4Card1Text').textContent = t.s4Card1Text;
                    document.getElementById('s4Card2Title').textContent = t.s4Card2Title;
                    document.getElementById('s4Card2Text').textContent = t.s4Card2Text;
                    document.getElementById('s4Card3Title').textContent = t.s4Card3Title;
                    document.getElementById('s4Card3Text').textContent = t.s4Card3Text;
                    document.getElementById('s4Footer').textContent = t.s4Footer;
                    break;
                case 5:
                    document.getElementById('s5Title').textContent = t.s5Title;
                    document.getElementById('s5Sub').textContent = t.s5Sub;
                    document.getElementById('s5Card1Title').textContent = t.s5Card1Title;
                    document.getElementById('s5Card1Text').textContent = t.s5Card1Text;
                    document.getElementById('s5Card2Text').innerHTML = t.s5Card2Text;
                    document.getElementById('s5Card3Text').innerHTML = t.s5Card3Text;
                    document.getElementById('s5Footer').textContent = t.s5Footer;
                    break;
            }

            if (step === 2 && timerDone) {
                nextBtn.disabled = false;
            } else if (step === 2 && !timerDone) {
                if (!timerRunning && timerCountdown === 10) {
                    nextBtn.disabled = true;
                } else if (timerRunning) {
                    nextBtn.disabled = true;
                }
            } else {
                nextBtn.disabled = false;
            }
        }

        // ============================================================
        // 步驟導航
        // ============================================================
        function nextStep() {
            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn.disabled) return;

            if (currentStep === 2 && !timerDone) return;

            if (currentStep === totalSteps - 1) {
                currentStep = totalSteps;
                renderStep(currentStep);
                localStorage.setItem('step_completed_5', 'true');
                return;
            }

            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep(currentStep);
                if (currentStep >= 1 && currentStep <= 4) {
                    localStorage.setItem('step_completed_' + currentStep, 'true');
                }
                if (currentStep === 2) {
                    if (!timerDone && !timerRunning) {
                        const saved = localStorage.getItem('oath_timer_done');
                        if (saved === 'true') {
                            timerDone = true;
                            timerRunning = false;
                            const lang = currentLang || 'zh';
                            const t = texts[lang];
                            document.getElementById('timerDisplay').textContent = '0';
                            document.getElementById('timerDisplay').className = 'timer-number done';
                            document.getElementById('timerStatus').textContent = t.timerStatusDone || '✅ 已完成誦讀';
                            document.getElementById('nextBtn').disabled = false;
                            const startBtn = document.getElementById('timerStartBtn');
                            const resetBtn = document.getElementById('timerResetBtn');
                            if (startBtn) { startBtn.disabled = false;
                                startBtn.textContent = '開始靜心'; }
                            if (resetBtn) resetBtn.style.display = 'inline-block';
                        }
                    }
                }
            }
        }

        function prevStep() {
            if (document.getElementById('prevBtn').disabled) return;
            if (currentStep > 1) {
                currentStep--;
                renderStep(currentStep);
            }
        }

        // ============================================================
        // 初始化
        // ============================================================
        function init() {
            document.getElementById('pageHome').classList.remove('hidden');
            document.getElementById('pageSteps').style.display = 'none';
            document.getElementById('pageSteps').classList.remove('show');
            document.getElementById('backHomeBtn').classList.remove('show');

            const savedTimer = localStorage.getItem('oath_timer_done');
            if (savedTimer === 'true') {
                timerDone = true;
                timerRunning = false;
            }

            renderHome();

            const savedStep = parseInt(localStorage.getItem('oath_step'));
            if (savedStep && savedStep > 1) {
                updateStepStatus();
            }

            const lang = currentLang || 'zh';
            const t = texts[lang];
            const statusEl = document.getElementById('timerStatus');
            const labelEl = document.getElementById('timerLabel');
            const startBtn = document.getElementById('timerStartBtn');
            const resetBtn = document.getElementById('timerResetBtn');

            if (labelEl) labelEl.textContent = t.timerLabel || '請靜心誦讀 10 秒';
            if (statusEl) statusEl.textContent = t.timerStatusReady || '⏳ 準備開始';
            if (startBtn) startBtn.textContent = '開始靜心';
            if (resetBtn) resetBtn.style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
