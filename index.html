<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>七印誓網 · 宇宙誓印覺醒工程</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0F0620;
      color: #F5F0F0;
      font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
    }
    h1 {
      color: #D4AF37;
      font-size: 28px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }
    .gold {
      color: #D4AF37;
    }
    .dim {
      color: #B8860B;
    }
    .card {
      background: rgba(26, 10, 58, 0.88);
      border: 1px solid #B8860B;
      border-radius: 14px;
      padding: 30px 24px;
      margin: 20px 0;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #B8860B, #D4AF37);
      color: #0F0620;
      font-weight: 700;
      padding: 14px 32px;
      border: none;
      border-radius: 40px;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(212,175,55,0.3);
    }
    .link {
      color: #00E5FF;
      text-decoration: underline;
      cursor: pointer;
    }
    .link:hover { color: #D4AF37; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✦ 七印誓網 ✦</h1>
    <p style="color: #B8860B; letter-spacing: 2px;">宇宙誓印覺醒工程</p>

    <div class="card">
      <p style="font-size: 18px; color: #F0D060;">🌌 網站建置中</p>
      <p style="color: rgba(245,240,255,0.7); margin: 12px 0;">
        七印誓網 App 正在部署，請稍候。
      </p>
      <p style="font-size: 13px; color: #B8860B;">
        ⏳ 預計 1~2 分鐘完成
      </p>
    </div>

    <a href="https://phoenixmainline.github.io/seven-oath-network/public/" class="btn">
      進入 App →
    </a>

    <p style="margin-top: 20px; font-size: 13px; color: #B8860B;">
      如果無法載入，請<a href="https://phoenixmainline.github.io/seven-oath-network/public/" class="link">點這裡</a>重試
    </p>
  </div>
</body>
</html>
