<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙誓印覺醒工程 • 七印誓網</title>
    <!-- 引入 FontAwesome 圖標庫與 Google 數位字型 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. 宇宙深邃科技感星空背景與動態粒子流動層（貫穿全場）
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', 'Share Tech Mono', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #061026 0%, #020611 100%);
            min-height: 100vh;
            color: #e0e8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 宇宙動態星芒粒子流動層：不被遮擋，穿透全畫面 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(rgba(212,175,55,.3), rgba(212,175,55,.05) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 450px 450px;
            background-position: 0 0, 40px 60px, 130px 270px;
            animation: starOrbit 120s linear infinite;
            opacity: 0.7;
            z-index: 2; /* 提高層級，使其能漂浮穿透在內框之上 */
            pointer-events: none;
        }

        @keyframes starOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ==========================================================================
           2. HUD 科技內框：與全背景同色，允許粒子穿透
           ========================================================================== */
        .hud-container {
            width: 100%;
            max-width: 680px;
            min-height: 85vh;
            background: rgba(2, 6, 17, 0.75); /* 與背景融合的色調，並帶有些微通透讓粒子隱現 */
            border: 1px solid rgba(41, 98, 255, 0.25);
            box-shadow: 0 0 50px rgba(0, 81, 255, 0.15), inset 0 0 30px rgba(41, 98, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1; /* 低於粒子層，確保粒子穿透 */
            margin: 20px;
        }

        /* 邊角 HUD 電子光標裝飾 */
        .hud-container::after {
            content: "";
            position: absolute;
            top: 15px; right: 15px; width: 15px; height: 15px;
            border-top: 2px solid rgba(0, 191, 255, 0.6);
            border-right: 2px solid rgba(0, 191, 255, 0.6);
            pointer-events: none;
        }

        /* ==========================================================================
           3. 頁首(Header)區域：統一專案名稱與雙語切換
           ========================================================================== */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(41, 98, 255, 0.2);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #00bfff;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.4);
        }

        /* 雙語切換按鈕組 */
        .lang-switch-group {
            display: flex;
            background: rgba(41, 98, 255, 0.15);
            border: 1px solid rgba(41, 98, 255, 0.3);
            border-radius: 20px;
            padding: 2px;
            z-index: 10; /* 確保按鈕在粒子上方可點擊 */
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: rgba(224, 232, 245, 0.5);
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: #00bfff;
            color: #020611;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0, 191, 255, 0.5);
        }

        /* ==========================================================================
           4. 全球啟動流程狀態導航欄
           ========================================================================== */
        .flow-nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 25px;
        }

        .flow-node {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 8px 4px;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(224, 232, 245, 0.4);
        }

        .flow-node.active {
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid #D4AF37;
            color: #D4AF37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
            font-weight: bold;
        }

        /* ==========================================================================
           5. 步驟主內容顯示區與內卡片
           ========================================================================== */
        .step-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hud-card {
            background: rgba(10, 25, 57, 0.4);
            border: 1px solid rgba(41, 98, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            box-shadow: inset 0 0 15px rgba(41, 98, 255, 0.05);
        }

        .card-title {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: #D4AF37;
        }

        .condition-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .condition-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: rgba(224, 232, 245, 0.85);
        }

        .condition-item i.check-icon {
            color: #00e676;
            margin-top: 3px;
            text-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
        }

        /* ==========================================================================
           6. 頁尾導航控制與專利右下角規格化頁碼
           ========================================================================== */
        .hud-footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid rgba(41, 98, 255, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10; /* 確保按鈕在粒子上方可點擊 */
        }

        .btn-next {
            background: rgba(0, 191, 255, 0.1);
            border: 1px solid rgba(0, 191, 255, 0.3);
            color: rgba(0, 191, 255, 0.6);
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-next:hover {
            background: rgba(0, 191, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.3);
        }

        .page-marker {
            font-size: 0.8rem;
            color: rgba(224, 232, 245, 0.4);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <!-- 頁首區域：系統名稱與雙語切換按鈕 -->
        <header class="hud-header">
            <div class="app-title" id="appTitle">宇宙誓印覺醒工程 • 七印誓網</div>
            <div class="lang-switch-group">
                <button class="lang-btn active" onclick="switchLanguage('zh')">中文</button>
                <button class="lang-btn" onclick="switchLanguage('en')">English</button>
            </div>
        </header>

        <!-- 全球啟動流程導航欄 -->
        <nav class="flow-nav">
            <div class="flow-node active" id="node1">[1] 啟動條件</div>
            <div class="flow-node" id="node2">[2] 授權誓讀</div>
            <div class="flow-node" id="node3">[3] 授權綁定</div>
            <div class="flow-node" id="node4">[4] 回傳結果</div>
            <div class="flow-node" id="node5">[5] 系統同步</div>
        </nav>

        <!-- 步驟主內容顯示區（目前依要求：只保留步驟一純淨卡片） -->
        <main class="step-content">
            <div class="hud-card">
                <div class="card-title">
                    <i class="fa-solid fa-bolt"></i>
                    <span id="cardTitleText">【一】啟動條件</span>
                </div>
                
                <!-- 條件確認檢核清單 -->
                <ul class="condition-list">
                    <li class="condition-item">
                        <i class="fa-solid fa-square-check check-icon"></i>
                        <span id="cond1">請完成驗證之【購書序號】誓導碼</span>
                    </li>
                    <li class="condition-item">
                        <i class="fa-solid fa-square-check check-icon"></i>
                        <span id="cond2">穩定網路環境運作中</span>
                    </li>
                    <li class="condition-item">
                        <i class="fa-solid fa-square-check check-icon"></i>
                        <span id="cond3">請掃描本卷書封底之《宇宙智能誓導平台》官方AI專屬誓導入口頁 QR Code，以啟動誓導通道之統一入口。</span>
                    </li>
                </ul>
            </div>
        </main>

        <!-- 頁尾控制與規格化頁碼 -->
        <footer class="hud-footer">
            <button class="btn-next" id="btnNext" onclick="executeNextStep()">
                <span id="btnNextText">進入下一步</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <div class="page-marker" id="pageMarker">📄 【宇宙誓印覺醒工程 • 覺醒卷】：第 3-4 頁</div>
        </footer>
    </div>

    <!-- ==========================================================================
       7. 智能雙語翻譯文本資料庫與控制邏輯
       ========================================================================== */ -->
    <script>
        let currentLang = 'zh';

        const langPack = {
            zh: {
                appTitle: "宇宙誓印覺醒工程 • 七印誓網",
                node1: "[1] 啟動條件",
                node2: "[2] 授權誓讀",
                node3: "[3] 授權綁定",
                node4: "[4] 回傳結果",
                node5: "[5] 系統同步",
                cardTitle: "【一】啟動條件",
                cond1: "請完成驗證之【購書序號】誓導碼",
                cond2: "穩定網路環境運作中",
                cond3: "請掃描本卷書封底之《宇宙智能誓導平台》官方AI專屬誓導入口頁 QR Code，以啟動誓導通道之統一入口。",
                btnNext: "進入下一步",
                pageMarker: "📄 【宇宙誓印覺醒工程 • 覺醒卷】：第 3-4 頁"
            },
            en: {
                appTitle: "Cosmic Oath Awakening Project · Seven-Seal Oath Network",
                node1: "[1] Conditions",
                node2: "[2] Authorized Vow",
                node3: "[3] Binding Phase",
                node4: "[4] Return Result",
                node5: "[5] Sync Phase",
                cardTitle: "[1] Activation Conditions",
                cond1: "Please complete the verification of the 【Purchase Serial Number】 Vow-Guidance Code",
                cond2: "Stable internet environment activated",
                cond3: "Please scan the QR Code on the back cover of this volume 《Cosmic Intelligent Vow-Guidance Platform》 Official AI Dedicated Vow-Guidance Entry Page QR Code to activate the unified access point.",
                btnNext: "Next Step",
                pageMarker: "📄 【Cosmic Oath Awakening Project • Awakening Scroll】: Pages 3-4"
            }
        };

        function switchLanguage(lang) {
            currentLang = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.textContent.toLowerCase().includes('english') && lang === 'en') btn.classList.add('active');
                if(btn.textContent.includes('中文') && lang === 'zh') btn.classList.add('active');
            });

            document.getElementById('appTitle').textContent = langPack[lang].appTitle;
            document.getElementById('node1').textContent = langPack[lang].node1;
            document.getElementById('node2').textContent = langPack[lang].node2;
            document.getElementById('node3').textContent = langPack[lang].node3;
            document.getElementById('node4').textContent = langPack[lang].node4;
            document.getElementById('node5').textContent = langPack[lang].node5;
            
            document.getElementById('cardTitleText').textContent = langPack[lang].cardTitle;
            document.getElementById('cond1').textContent = langPack[lang].cond1;
            document.getElementById('cond2').textContent = langPack[lang].cond2;
            document.getElementById('cond3').textContent = langPack[lang].cond3;
            
            document.getElementById('btnNextText').textContent = langPack[lang].btnNext;
            document.getElementById('pageMarker').textContent = langPack[lang].pageMarker;
        }

        // 預留擴充槽：專供下一步貼上代碼整合切換
        function executeNextStep() {
            console.log("步驟一確認完畢，等待下一步指令。");
        }
    </script>
</body>
</html>
