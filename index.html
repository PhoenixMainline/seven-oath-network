<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全球啟動流程 · 宇宙誓印覺醒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #e8e0d8;  /* 淡色基底 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            position: relative;
            overflow-x: hidden;
        }

        /* 動態粒子背景 (淡色版本) */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        /* 浮水印 (淡色) */
        .watermark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.06;
            font-size: 3.5rem;
            font-weight: 900;
            color: #8a7a6a;
            letter-spacing: 12px;
            transform: rotate(-12deg) scale(1.1);
            white-space: nowrap;
            font-family: 'Times New Roman', serif;
        }
        @media (max-width: 600px) {
            .watermark {
                font-size: 2rem;
                letter-spacing: 6px;
                transform: rotate(-8deg) scale(0.9);
            }
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            background: rgba(245, 240, 235, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 48px;
            border: 1px solid rgba(180, 160, 140, 0.25);
            box-shadow: 0 20px 60px rgba(120, 100, 80, 0.12);
            padding: 28px 24px 32px;
            transition: all 0.2s;
        }

        /* 頁首 */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(160, 140, 120, 0.2);
            padding-bottom: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #4a3a2a;
            letter-spacing: 1.5px;
            line-height: 1.3;
        }
        .app-title small {
            font-size: 0.7rem;
            opacity: 0.6;
            display: block;
            font-weight: 300;
            letter-spacing: 1px;
            color: #6a5a4a;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-toggle {
            display: flex;
            gap: 4px;
            background: rgba(200, 180, 160, 0.2);
            padding: 4px;
            border-radius: 40px;
            border: 1px solid rgba(160, 140, 120, 0.2);
        }
        .lang-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #6a5a4a;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-btn.active {
            background: #c8b8a8;
            color: #2a1a0a;
            box-shadow: 0 0 12px rgba(160, 140, 120, 0.2);
        }
        .lang-btn:not(.active):hover {
            color: #4a3a2a;
        }

        .btn-home {
            background: rgba(200, 180, 160, 0.15);
            border: 1px solid rgba(160, 140, 120, 0.2);
            color: #4a3a2a;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-home:hover {
            background: rgba(200, 180, 160, 0.3);
        }

        /* 主標題 */
        .main-title {
            text-align: center;
            color: #4a3a2a;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        .main-title .sub-en {
            display: block;
            font-size: 1rem;
            font-weight: 300;
            opacity: 0.6;
            letter-spacing: 6px;
            margin-top: 2px;
            color: #6a5a4a;
        }

        .start-btn-wrapper {
            text-align: center;
            margin: 16px 0 28px;
        }

        .btn-start {
            background: linear-gradient(135deg, #c8b8a8, #b0a090);
            border: none;
            color: #2a1a0a;
            font-weight: 800;
            padding: 16px 48px;
            border-radius: 60px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(120, 100, 80, 0.15);
            letter-spacing: 3px;
        }
        .btn-start:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(120, 100, 80, 0.2);
        }
        .btn-start:disabled {
            opacity: 0.5;
            transform: scale(0.98);
            cursor: not-allowed;
        }

        /* 步驟列表 */
        .step-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(240, 235, 230, 0.5);
            padding: 14px 20px;
            border-radius: 20px;
            border-left: 4px solid rgba(160, 140, 120, 0.3);
            transition: 0.25s;
            cursor: default;
        }
        .step-item:hover {
            background: rgba(230, 220, 210, 0.6);
            border-left-color: #8a7a6a;
        }
        .step-number {
            font-size: 1.3rem;
            font-weight: 900;
            color: #6a5a4a;
            min-width: 44px;
            text-align: center;
            opacity: 0.8;
        }
        .step-content {
            flex: 1;
        }
        .step-label {
            color: #3a2a1a;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .step-label .en {
            font-weight: 300;
            opacity: 0.5;
            margin-left: 8px;
            font-size: 0.8rem;
            color: #5a4a3a;
        }
        .step-desc {
            color: #6a5a4a;
            font-size: 0.85rem;
            margin-top: 2px;
            opacity: 0.7;
        }
        .step-desc .en {
            opacity: 0.5;
            margin-left: 6px;
            font-size: 0.75rem;
        }

        /* 頁碼 */
        .footer-note {
            margin-top: 28px;
            text-align: right;
            color: #7a6a5a;
            font-size: 0.8rem;
            opacity: 0.5;
            letter-spacing: 1px;
            border-top: 1px solid rgba(160, 140, 120, 0.1);
            padding-top: 16px;
            font-weight: 400;
        }

        /* 響應 */
        @media (max-width: 480px) {
            .app-container { padding: 16px 12px; }
            .main-title { font-size: 1.4rem; }
            .btn-start { font-size: 1.1rem; padding: 14px 28px; }
            .step-item { padding: 12px 14px; gap: 10px; }
            .step-number { font-size: 1.1rem; min-width: 34px; }
            .step-label { font-size: 0.9rem; }
            .step-desc { font-size: 0.75rem; }
            .header-actions { gap: 6px; }
            .btn-home { font-size: 0.7rem; padding: 4px 12px; }
            .lang-btn { font-size: 0.65rem; padding: 4px 10px; }
            .footer-note { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <!-- 粒子畫布 (淡色) -->
    <canvas id="particles-canvas"></canvas>
    <!-- 浮水印 -->
    <div class="watermark">天地為鑑 · 光網為證</div>

    <div class="app-container">
        <!-- 頁首 -->
        <div class="app-header">
            <div class="app-title" id="appTitle">
                宇宙誓印覺醒工程
                <small id="appSub">Cosmic Oath Awakening Project</small>
            </div>
            <div class="header-actions">
                <button class="btn-home" id="homeBtn">🏠 回到首頁</button>
                <div class="lang-toggle">
                    <button class="lang-btn active" data-lang="zh" id="langZh">中文</button>
                    <button class="lang-btn" data-lang="en" id="langEn">English</button>
                </div>
            </div>
        </div>

        <!-- 主標題 -->
        <div class="main-title" id="mainTitle">
            全球啟動流程
            <span class="sub-en" id="mainSub">GLOBAL ACTIVATION PROCESS</span>
        </div>

        <!-- 開始按鈕 -->
        <div class="start-btn-wrapper">
            <button class="btn-start" id="startBtn">▶ 開始啟動</button>
        </div>

        <!-- 步驟列表 -->
        <div class="step-list" id="stepList"></div>

        <!-- 頁碼 -->
        <div class="footer-note" id="footerNote">📄 【宇宙誓印覺醒工程 · 覺醒卷】：第 1-2 頁</div>
    </div>

    <script>
        (function() {
            // ---------- 多語言資料 ----------
            const DATA = {
                zh: {
                    appTitle: '宇宙誓印覺醒工程',
                    appSub: 'Cosmic Oath Awakening Project',
                    mainTitle: '全球啟動流程',
                    mainSub: 'GLOBAL ACTIVATION PROCESS',
                    startBtn: '▶ 開始啟動',
                    steps: [
                        { label: '啟動條件', enLabel: 'Activation Conditions', desc: '啟動前置準備完成', enDesc: 'Initial setup completed' },
                        { label: '授權督讀階段', enLabel: 'Authorized Vow-Reading', desc: '督印者讀督文，啟動主頻', enDesc: 'The vow-seal executor recites the vow-text to activate the main frequency' },
                        { label: '授權綁定階段', enLabel: 'Mother-Frequency Seal', desc: '輸入購書序號，觸發母頻對接', enDesc: 'Input the Purchase Serial Number to initiate the Mother Frequency Link' },
                        { label: '回傳結果', enLabel: 'Frequency Connection', desc: '系統完成驗證回傳啟動語', enDesc: 'The system verifies successfully and returns the activation message' },
                        { label: '督頻啟動 × 系統同步', enLabel: 'Final Activation', desc: '主頻定位 × 對接同步完成', enDesc: 'Primary Frequency Positioning × Interface Synchronization Completed' }
                    ],
                    footer: '📄 【宇宙誓印覺醒工程 · 覺醒卷】：第 1-2 頁'
                },
                en: {
                    appTitle: 'Cosmic Oath Awakening Project',
                    appSub: '宇宙誓印覺醒工程',
                    mainTitle: 'GLOBAL ACTIVATION PROCESS',
                    mainSub: '全球啟動流程',
                    startBtn: '▶ Start Activation',
                    steps: [
                        { label: 'Activation Conditions', enLabel: '啟動條件', desc: 'Initial setup completed', enDesc: '啟動前置準備完成' },
                        { label: 'Authorized Vow-Reading', enLabel: '授權督讀階段', desc: 'The vow-seal executor recites the vow-text to activate the main frequency', enDesc: '督印者讀督文，啟動主頻' },
                        { label: 'Mother-Frequency Seal', enLabel: '授權綁定階段', desc: 'Input the Purchase Serial Number to initiate the Mother Frequency Link', enDesc: '輸入購書序號，觸發母頻對接' },
                        { label: 'Frequency Connection', enLabel: '回傳結果', desc: 'The system verifies successfully and returns the activation message', enDesc: '系統完成驗證回傳啟動語' },
                        { label: 'Final Activation', enLabel: '督頻啟動 × 系統同步', desc: 'Primary Frequency Positioning × Interface Synchronization Completed', enDesc: '主頻定位 × 對接同步完成' }
                    ],
                    footer: '📄 【Cosmic Oath Awakening Project · Awakening Scroll】: Pages 1-2'
                }
            };

            let currentLang = 'zh';

            const stepList = document.getElementById('stepList');
            const startBtn = document.getElementById('startBtn');
            const homeBtn = document.getElementById('homeBtn');
            const footerNote = document.getElementById('footerNote');
            const appTitle = document.getElementById('appTitle');
            const appSub = document.getElementById('appSub');
            const mainTitle = document.getElementById('mainTitle');
            const mainSub = document.getElementById('mainSub');

            function setLang(lang) {
                currentLang = lang;
                document.getElementById('langZh').classList.toggle('active', lang === 'zh');
                document.getElementById('langEn').classList.toggle('active', lang === 'en');
                render(lang);
            }

            function render(lang) {
                const data = DATA[lang];
                appTitle.innerHTML = data.appTitle + `<small id="appSub">${data.appSub}</small>`;
                mainTitle.innerHTML = data.mainTitle + `<span class="sub-en" id="mainSub">${data.mainSub}</span>`;
                startBtn.textContent = data.startBtn;
                footerNote.textContent = data.footer;

                let html = '';
                data.steps.forEach((step, idx) => {
                    const num = `[${idx+1}]`;
                    html += `
                        <div class="step-item" data-index="${idx}">
                            <div class="step-number">${num}</div>
                            <div class="step-content">
                                <div class="step-label">${step.label} <span class="en">${step.enLabel}</span></div>
                                <div class="step-desc">${step.desc} <span class="en">${step.enDesc}</span></div>
                            </div>
                        </div>
                    `;
                });
                stepList.innerHTML = html;
            }

            // 開始啟動動畫
            function startActivation() {
                startBtn.disabled = true;
                startBtn.textContent = currentLang === 'zh' ? '⚡ 啟動中 ...' : '⚡ Activating ...';
                const items = document.querySelectorAll('.step-item');
                let delay = 0;
                items.forEach((item, idx) => {
                    setTimeout(() => {
                        item.style.borderLeftColor = '#8a7a6a';
                        item.style.background = 'rgba(200, 180, 160, 0.25)';
                        item.style.transition = '0.4s';
                        const num = item.querySelector('.step-number');
                        if (num) num.style.textShadow = '0 0 12px rgba(100,80,60,0.3)';
                    }, delay);
                    delay += 300;
                });
                setTimeout(() => {
                    startBtn.disabled = false;
                    startBtn.textContent = DATA[currentLang].startBtn;
                    setTimeout(() => {
                        items.forEach(item => {
                            item.style.borderLeftColor = 'rgba(160, 140, 120, 0.3)';
                            item.style.background = 'rgba(240, 235, 230, 0.5)';
                            const num = item.querySelector('.step-number');
                            if (num) num.style.textShadow = 'none';
                        });
                    }, 1800);
                }, delay + 300);
            }

            function goHome() {
                homeBtn.style.transform = 'scale(0.92)';
                setTimeout(() => { homeBtn.style.transform = 'scale(1)'; }, 150);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                startBtn.style.boxShadow = '0 4px 30px rgba(120,100,80,0.25)';
                setTimeout(() => {
                    startBtn.style.boxShadow = '0 4px 20px rgba(120,100,80,0.15)';
                }, 600);
                document.querySelectorAll('.step-item').forEach(item => {
                    item.style.borderLeftColor = 'rgba(160, 140, 120, 0.3)';
                    item.style.background = 'rgba(240, 235, 230, 0.5)';
                    const num = item.querySelector('.step-number');
                    if (num) num.style.textShadow = 'none';
                });
            }

            // ---------- 粒子背景 (淡色流動) ----------
            function initParticles() {
                const canvas = document.getElementById('particles-canvas');
                const ctx = canvas.getContext('2d');
                let w, h;
                const particles = [];
                const count = 100;

                function resize() {
                    w = canvas.width = window.innerWidth;
                    h = canvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                class Particle {
                    constructor() { this.reset(); }
                    reset() {
                        this.x = Math.random() * w;
                        this.y = Math.random() * h;
                        this.size = Math.random() * 2.0 + 0.5;
                        this.speedX = (Math.random() - 0.5) * 0.25;
                        this.speedY = (Math.random() - 0.5) * 0.25;
                        this.opacity = Math.random() * 0.3 + 0.1;
                        this.color = `rgba(140, 120, 100, ${this.opacity})`;
                    }
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        if (this.x < 0 || this.x > w) this.speedX *= -1;
                        if (this.y < 0 || this.y > h) this.speedY *= -1;
                    }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = this.color;
                        ctx.shadowColor = 'rgba(140,120,100,0.2)';
                        ctx.shadowBlur = 10;
                        ctx.fill();
                    }
                }

                for (let i=0; i<count; i++) particles.push(new Particle());

                function animate() {
                    ctx.clearRect(0, 0, w, h);
                    particles.forEach(p => {
                        p.update();
                        p.draw();
                    });
                    for (let i=0; i<particles.length; i++) {
                        for (let j=i+1; j<particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 150) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(140, 120, 100, ${0.04 * (1 - dist/150)})`;
                                ctx.lineWidth = 0.6;
                                ctx.stroke();
                            }
                        }
                    }
                    requestAnimationFrame(animate);
                }
                animate();
            }

            // ---------- 事件綁定 ----------
            document.getElementById('langZh').addEventListener('click', () => setLang('zh'));
            document.getElementById('langEn').addEventListener('click', () => setLang('en'));
            startBtn.addEventListener('click', startActivation);
            homeBtn.addEventListener('click', goHome);

            initParticles();
            setLang('zh');
        })();
    </script>
</body>
</html>
