<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全球啟動流程 · 宇宙誓印覺醒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #156082;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            position: relative;
            overflow-x: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .watermark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.04;
            font-size: 3.5rem;
            font-weight: 900;
            color: #FFC000;
            letter-spacing: 12px;
            text-shadow: 0 0 30px #FFC00022;
            transform: rotate(-12deg) scale(1.1);
            white-space: nowrap;
            font-family: 'Times New Roman', serif;
        }
        @media (max-width: 600px) {
            .watermark {
                font-size: 2rem;
                letter-spacing: 6px;
                transform: rotate(-8deg) scale(0.9);
            }
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            background: rgba(10, 20, 40, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            border: 1px solid rgba(255, 192, 0, 0.12);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 28px 24px 32px;
            transition: all 0.2s;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 192, 0, 0.10);
            padding-bottom: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #FFC000;
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px #FFC00033;
            line-height: 1.3;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-toggle {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px;
            border-radius: 40px;
            border: 1px solid rgba(255, 192, 0, 0.10);
        }
        .lang-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #a09080;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-btn.active {
            background: #FFC000;
            color: #0A060E;
            box-shadow: 0 0 20px #FFC00044;
        }
        .lang-btn:not(.active):hover {
            color: #FFC000;
        }

        .btn-home {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 192, 0, 0.12);
            color: #FFC000;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-home:hover {
            background: rgba(255, 192, 0, 0.06);
            box-shadow: 0 0 20px #FFC00022;
        }

        .main-title {
            text-align: center;
            color: #FFC000;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-shadow: 0 0 30px #FFC00033;
            margin-bottom: 8px;
        }

        .start-btn-wrapper {
            text-align: center;
            margin: 16px 0 28px;
        }

        .btn-start {
            background: linear-gradient(135deg, #FFC000, #d4a000);
            border: none;
            color: #0A060E;
            font-weight: 800;
            padding: 16px 48px;
            border-radius: 60px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 30px #FFC00033;
            letter-spacing: 3px;
        }
        .btn-start:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 40px #FFC00055;
        }
        .btn-start:disabled {
            opacity: 0.5;
            transform: scale(0.98);
            cursor: not-allowed;
        }

        .step-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: transparent; 
            padding: 14px 20px;
            border-radius: 20px;
            border-left: 4px solid rgba(255, 192, 0, 0.18);
            transition: 0.25s;
            cursor: default;
        }
       .step-item:hover {
            background: rgba(255, 192, 0, 0.05);
            border-left-color: #FFC000;
        }
        .step-number {
            font-size: 1.3rem;
            font-weight: 900;
            color: #FFC000;
            min-width: 44px;
            text-align: center;
            opacity: 0.8;
        }
        .step-content {
            flex: 1;
        }
        .step-label {
            color: #f0e8d8;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .step-desc {
            color: #b0a898;
            font-size: 0.85rem;
            margin-top: 2px;
            opacity: 0.7;
        }

        .footer-note {
            margin-top: 28px;
            text-align: right;
            color: #FFC000;
            font-size: 0.8rem;
            opacity: 0.3;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255,192,0,0.05);
            padding-top: 16px;
            font-weight: 400;
        }

        @media (max-width: 480px) {
            .app-container { padding: 16px 12px; }
            .main-title { font-size: 1.4rem; }
            .btn-start { font-size: 1.1rem; padding: 14px 28px; }
            .step-item { padding: 12px 14px; gap: 10px; }
            .step-number { font-size: 1.1rem; min-width: 34px; }
            .step-label { font-size: 0.9rem; }
            .step-desc { font-size: 0.75rem; }
            .header-actions { gap: 6px; }
            .btn-home { font-size: 0.7rem; padding: 4px 12px; }
            .lang-btn { font-size: 0.65rem; padding: 4px 10px; }
            .footer-note { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="watermark">天地為鑑 · 光網為證</div>

    <div class="app-container">
        <div class="app-header">
            <div class="app-title" id="appTitle">宇宙誓印覺醒工程</div>
            <div class="header-actions">
                <button class="btn-home" id="homeBtn">🏠 回到首頁</button>
                <div class="lang-toggle">
                    <button class="lang-btn active" data-lang="zh" id="langZh">中文</button>
                    <button class="lang-btn" data-lang="en" id="langEn">English</button>
                </div>
            </div>
        </div>

        <div class="main-title" id="mainTitle">全球啟動流程</div>

        <div class="start-btn-wrapper">
            <button class="btn-start" id="startBtn">▶ 開始啟動</button>
        </div>

        <div class="step-list" id="stepList"></div>

        <div class="footer-note" id="footerNote">📄 【宇宙誓印覺醒工程 · 覺醒卷】：第 1-2 頁</div>
    </div>

    <script>
        (function() {
            const DATA = {
                zh: {
                    appTitle: '宇宙誓印覺醒工程',
                    mainTitle: '全球啟動流程',
                    startBtn: '▶ 開始啟動',
                    steps: [
                        { label: '啟動條件', desc: '啟動前置準備完成' },
                        { label: '授權誓讀階段', desc: '誓印者讀誓文，啟動主頻' },
                        { label: '授權綁定階段', desc: '輸入購書序號，觸發母頻對接' },
                        { label: '回傳結果', desc: '系統完成驗證回傳啟動語' },
                        { label: '誓頻啟動 × 系統同步', desc: '主頻定位 × 對接同步完成' }
                    ],
                    footer: '📄 【宇宙誓印覺醒工程 · 覺醒卷】：第 1-2 頁',
                    homeBtn: '🏠 回到首頁'
                },
                en: {
                    appTitle: 'Cosmic Oath Awakening Project',
                    mainTitle: 'GLOBAL ACTIVATION PROCESS',
                    startBtn: '▶ Start Activation',
                    steps: [
                        { label: 'Activation Conditions', desc: 'Initial setup completed' },
                        { label: 'Authorized Vow-Reading', desc: 'The vow-seal executor recites the vow-text to activate the main frequency' },
                        { label: 'Mother-Frequency Seal', desc: 'Input the Purchase Serial Number to initiate the Mother Frequency Link' },
                        { label: 'Frequency Connection', desc: 'The system verifies successfully and returns the activation message' },
                        { label: 'Vow-Frequency Activation × System Sync', desc: 'Primary Frequency Positioning × Interface Synchronization Completed' }
                    ],
                    footer: '📄 【Cosmic Oath Awakening Project · Awakening Scroll】: Pages 1-2',
                    homeBtn: '🏠 Home'
                }
            };

            let currentLang = 'zh';

            const stepList = document.getElementById('stepList');
            const startBtn = document.getElementById('startBtn');
            const homeBtn = document.getElementById('homeBtn');
            const footerNote = document.getElementById('footerNote');
            const appTitle = document.getElementById('appTitle');
            const mainTitle = document.getElementById('mainTitle');

            function setLang(lang) {
                currentLang = lang;
                document.getElementById('langZh').classList.toggle('active', lang === 'zh');
                document.getElementById('langEn').classList.toggle('active', lang === 'en');
                render(lang);
            }

            function render(lang) {
                const data = DATA[lang];
                appTitle.textContent = data.appTitle;
                mainTitle.textContent = data.mainTitle;
                startBtn.textContent = data.startBtn;
                footerNote.textContent = data.footer;
                homeBtn.textContent = data.homeBtn;

                let html = '';
                data.steps.forEach((step, idx) => {
                    const num = `[${idx+1}]`;
                    html += `
                        <div class="step-item" data-index="${idx}">
                            <div class="step-number">${num}</div>
                            <div class="step-content">
                                <div class="step-label">${step.label}</div>
                                <div class="step-desc">${step.desc}</div>
                            </div>
                        </div>
                    `;
                });
                stepList.innerHTML = html;
            }

           function startActivation() {
                startBtn.disabled = true;
                startBtn.textContent = currentLang === 'zh' ? '⚡ 啟動中 ...' : '⚡ Activating ...';
                const items = document.querySelectorAll('.step-item');
                let delay = 0;
                items.forEach((item) => {
                    setTimeout(() => {
                        item.style.borderLeftColor = '#FFC000';
                        item.style.background = 'rgba(255, 192, 0, 0.05)'; 
                        item.style.transition = '0.4s';
                        const num = item.querySelector('.step-number');
                        if (num) num.style.textShadow = '0 0 20px #FFC000';
                    }, delay);
                    delay += 300;
                });
                setTimeout(() => {
                    startBtn.disabled = false;
                    startBtn.textContent = DATA[currentLang].startBtn;
                    setTimeout(() => {
                        items.forEach(item => {
                            item.style.borderLeftColor = 'rgba(255, 192, 0, 0.18)';
                            item.style.background = 'transparent'; 
                            const num = item.querySelector('.step-number');
                            if (num) num.style.textShadow = 'none';
                        });
                    }, 1800);
                }, delay + 300);
            }

          function goHome() {
                homeBtn.style.transform = 'scale(0.92)';
                setTimeout(() => { homeBtn.style.transform = 'scale(1)'; }, 150);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                startBtn.style.boxShadow = '0 6px 40px #FFC00055';
                setTimeout(() => {
                    startBtn.style.boxShadow = '0 6px 30px #FFC00033';
                }, 600);
                document.querySelectorAll('.step-item').forEach(item => {
                    item.style.borderLeftColor = 'rgba(255, 192, 0, 0.18)';
                    item.style.background = 'transparent';
                    const num = item.querySelector('.step-number');
                    if (num) num.style.textShadow = 'none';
                });
            }

            function initParticles() {
                const canvas = document.getElementById('particles-canvas');
                const ctx = canvas.getContext('2d');
                let w, h;
                const particles = [];
                const count = 130;

                function resize() {
                    w = canvas.width = window.innerWidth;
                    h = canvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                class Particle {
                    constructor() { this.reset(); }
                    reset() {
                        this.x = Math.random() * w;
                        this.y = Math.random() * h;
                        this.size = Math.random() * 2.4 + 0.6;
                        this.speedX = (Math.random() - 0.5) * 0.3;
                        this.speedY = (Math.random() - 0.5) * 0.3;
                        this.opacity = Math.random() * 0.5 + 0.2;
                        this.color = `rgba(255, 192, 0, ${this.opacity})`;
                    }
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        if (this.x < 0 || this.x > w) this.speedX *= -1;
                        if (this.y < 0 || this.y > h) this.speedY *= -1;
                    }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = this.color;
                        ctx.shadowColor = '#FFC00044';
                        ctx.shadowBlur = 14;
                        ctx.fill();
                    }
                }

                for (let i = 0; i < count; i++) particles.push(new Particle());

                function animate() {
                    ctx.clearRect(0, 0, w, h);
                    particles.forEach(p => {
                        p.update();
                        p.draw();
                    });
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 160) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(255, 192, 0, ${0.05 * (1 - dist / 160)})`;
                                ctx.lineWidth = 0.7;
                                ctx.stroke();
                            }
                        }
                    }
                    requestAnimationFrame(animate);
                }
                animate();
            }

            document.getElementById('langZh').addEventListener('click', () => setLang('zh'));
            document.getElementById('langEn').addEventListener('click', () => setLang('en'));
            startBtn.addEventListener('click', startActivation);
            homeBtn.addEventListener('click', goHome);

            initParticles();
            setLang('zh');
        })();
    </script>
</body>
</html>
