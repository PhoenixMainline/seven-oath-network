    <style>
        /* ==========================================================================
           1. 宇宙深邃背景、金黃星芒粒子與防偽浮水印（原設定調回）
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', 'Share Tech Mono', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #06122c 0%, #020715 100%);
            min-height: 100vh;
            color: #e0e8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 🌌 金黃動態星芒粒子流動層：完全穿透內外框 */
        .particle-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(#d4af37, rgba(212,175,55,.3) 1px, transparent 30px),
                radial-gradient(#d4af37, rgba(212,175,55,.2) 2px, transparent 40px);
            background-size: 350px 350px, 450px 450px;
            background-position: 0 0, 90px 150px;
            animation: starMove 90s linear infinite;
            opacity: 0.65;
            z-index: 5; /* 提高層級，使其自由穿透文字與內框 */
            pointer-events: none;
        }

        @keyframes starMove {
            from { transform: translateY(0px) rotate(0deg); }
            to { transform: translateY(-1000px) rotate(360deg); }
        }

        /* 📜 「天地為鑑・光網為證」純CSS防偽浮水印層 */
        .watermark-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.04;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            padding: 50px;
        }

        .watermark-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            transform: rotate(-25deg);
            white-space: nowrap;
            user-select: none;
        }

        /* ==========================================================================
           2. HUD 科技內框（調回通透原設定，允許粒子穿透）
           ========================================================================== */
        .hud-container {
            width: 100%;
            max-width: 660px;
            background: rgba(4, 13, 33, 0.4); /* 調回通透的原設定，不遮擋粒子 */
            border: 1.5px solid rgba(0, 191, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 191, 255, 0.15), inset 0 0 20px rgba(0, 191, 255, 0.05);
            border-radius: 28px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 3;
            margin: 20px;
        }

        /* 右上角 HUD 光標細節 */
        .hud-container::after {
            content: "";
            position: absolute;
            top: 18px; right: 18px; width: 14px; height: 14px;
            border-top: 3px solid #00bfff;
            border-right: 3px solid #00bfff;
            pointer-events: none;
        }

        /* ==========================================================================
           3. 頁首(Header)區域：專案標題與語系切換
           ========================================================================== */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 191, 255, 0.15);
            padding-bottom: 18px;
            margin-bottom: 25px;
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #d4af37; /* 金黃色標題 */
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
        }

        .lang-switch-group {
            display: flex;
            background: rgba(0, 191, 255, 0.08);
            border: 1px solid rgba(0, 191, 255, 0.25);
            border-radius: 20px;
            padding: 2px;
            z-index: 10;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: rgba(224, 232, 245, 0.4);
            padding: 5px 14px;
            font-size: 0.8rem;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: #00bfff;
            color: #020611;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.4);
        }

        /* ==========================================================================
           4. 全球流程導航欄
           ========================================================================== */
        .flow-nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 30px;
        }

        .flow-node {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 8px 2px;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(224, 232, 245, 0.35);
        }

        .flow-node.active {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid #d4af37;
            color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
            font-weight: bold;
        }

        /* ==========================================================================
           5. 步驟一主卡片區域（完全純淨）
           ========================================================================== */
        .step-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .hud-card {
            background: rgba(6, 18, 44, 0.3);
            border: 1px solid rgba(0, 191, 255, 0.12);
            border-radius: 16px;
            padding: 24px;
        }

        .card-title {
            font-size: 1.2rem;
            color: #d4af37;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .condition-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .condition-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: rgba(224, 232, 245, 0.85);
        }

        .condition-item i.check-icon {
            color: #00e676;
            margin-top: 4px;
            text-shadow: 0 0 8px rgba(0, 230, 118, 0.3);
        }

        /* ==========================================================================
           6. 頁尾導航與右下角規格化頁碼

        .hud-footer {
            margin-top: 35px;
            padding-top: 18px;

            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;

        }

        .btn-next:hover {
            background: rgba(0, 191, 255, 0.1);

        }

        .page-marker {
            font-size: 0.78rem;
            color: rgba(224, 232, 245, 0.35);
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <script>
        let currentLang = 'zh';

        const langPack = {
            zh: {
                appTitle: "【宇宙誓印覺醒工程 • 七印誓網】",

        function switchLanguage(lang) {

            document.getElementById('btnNextText').textContent = langPack[lang].btnNext;
            document.querySelector('#pageMarker span').textContent = langPack[lang].pageMarker;
        }
