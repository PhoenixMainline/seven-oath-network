<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球啟動流程</title>

<!-- 掃碼套件 -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family: sans-serif;
    color:#fff;
    overflow:hidden;
}

/* 背景動畫 */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

/* UI */
.container{
    max-width:600px;
    margin:auto;
    padding:20px;
    text-align:center;
}

h1{color:#ffd54f;}

button{
    padding:12px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.start{
    background:linear-gradient(90deg,#ff9800,#ff5722);
    width:100%;
}

.step{
    background:rgba(255,255,255,0.08);
    margin:8px;
    padding:12px;
    border-radius:8px;
}

.active{background:#ffc107;color:#000;}
.locked{opacity:0.3;}

.hidden{display:none;}

#reader{
    width:250px;
    margin:auto;
}

.status{
    margin-top:10px;
    font-size:14px;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

<h1 id="title">全球啟動流程</h1>

<button class="start" id="startBtn">開始啟動</button>

<div id="steps"></div>

<!-- 掃碼 -->
<div id="scanner" class="hidden">
    <h3>QR 驗證</h3>
    <div id="reader"></div>
    <p id="scanResult"></p>
</div>

<p class="status" id="status"></p>

</div>

<script>
/* ===== 粒子背景 ===== */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<100;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        vx:Math.random()*0.5,
        vy:Math.random()*0.5
    });
}

function animate(){
    ctx.fillStyle="rgba(0,0,20,0.3)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00e5ff";

    particles.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;

        if(p.x>canvas.width) p.x=0;
        if(p.y>canvas.height) p.y=0;

        ctx.fillRect(p.x,p.y,2,2);
    });

    requestAnimationFrame(animate);
}
animate();

/* ===== 流程 ===== */
const stepsData = [
    "啟動條件",
    "授權誓讀",
    "母頻驗證（掃碼）",
    "回傳結果",
    "最終啟動"
];

let current = -1;

const stepsDiv = document.getElementById("steps");

function renderSteps(){
    stepsDiv.innerHTML="";
    stepsData.forEach((s,i)=>{
        const div=document.createElement("div");
        div.className="step";

        if(i===current) div.classList.add("active");
        if(i>current) div.classList.add("locked");

        div.innerText=`[${i+1}] ${s}`;
        stepsDiv.appendChild(div);
    });
}

/* 開始 */
document.getElementById("startBtn").onclick=()=>{
    current=0;
    renderSteps();
    updateStatus();
};

/* 下一步 */
function nextStep(){
    current++;
    renderSteps();
    updateStatus();
}

/* 狀態 */
function updateStatus(){
    const status=document.getElementById("status");

    if(current===2){
        startScanner();
        status.innerText="請掃描 QR Code 驗證";
    }else if(current>=stepsData.length){
        status.innerText="✅ 啟動完成";
    }else{
        status.innerText="處理中...";
        setTimeout(()=>nextStep(),1000);
    }
}

/* ===== 掃碼 ===== */
function startScanner(){
    document.getElementById("scanner").classList.remove("hidden");

    const qr = new Html5Qrcode("reader");

    qr.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 200 },
        (decodedText)=>{
            document.getElementById("scanResult").innerText =
                "驗證成功: " + decodedText;

            qr.stop();
            document.getElementById("scanner").classList.add("hidden");

            nextStep();
        }
    );
}

/* 初始化 */
renderSteps();
</script>

</body>
</html>
