<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【宇宙誓印覺醒工程 · 七印誓網】啟動入口</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* ----- 全域樣式（與 index 一致的亮紫色系）----- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', 'Share Tech Mono', sans-serif; }
        body {
            background: radial-gradient(circle at 50% 50%, #06122c 0%, #020715 100%);
            min-height: 100vh;
            color: #e0e8f5;
            display: flex; justify-content: center; align-items: center;
            padding: clamp(8px, 2vh, 24px);
            position: relative;
        }
        /* 粒子背景 */
        .particle-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: radial-gradient(#d4af37, rgba(212, 175, 55, .3) 1px, transparent 30px), radial-gradient(#d4af37, rgba(212, 175, 55, .2) 2px, transparent 40px);
            background-size: 350px 350px, 450px 450px;
            background-position: 0 0, 90px 150px;
            animation: starMove 90s linear infinite; opacity: 0.65; z-index: 5; pointer-events: none;
        }
        @keyframes starMove { from { transform: translateY(0px) rotate(0deg); } to { transform: translateY(-1000px) rotate(360deg); } }
        /* 浮水印 */
        .watermark-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; opacity: 0.04;
            display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); padding: 50px;
        }
        .watermark-text { font-size: 1.5rem; font-weight: bold; color: #ffffff; transform: rotate(-25deg); white-space: nowrap; user-select: none; }
        /* 主容器 */
        .hud-container {
            width: 100%; max-width: min(1100px, 98vw);
            background: rgba(4, 13, 33, 0.4);
            border: 1.5px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.15), inset 0 0 20px rgba(168, 85, 247, 0.05);
            border-radius: clamp(16px, 4vw, 28px);
            padding: clamp(16px, 3vh, 36px);
            position: relative; z-index: 10;
        }
        .hud-container::after {
            content: ""; position: absolute; top: 18px; right: 18px;
            width: 14px; height: 14px;
            border-top: 3px solid #a78bfa; border-right: 3px solid #a78bfa;
            pointer-events: none;
        }
        /* 標題區 */
        .header {
            text-align: center;
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            padding-bottom: 20px;
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: clamp(1.2rem, 3.2vh, 2rem);
            font-weight: 700;
            color: #e9d5ff;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            letter-spacing: 2px;
            line-height: 1.4;
        }
        .header h1 i { color: #a78bfa; margin-right: 8px; }
        .header .sub {
            color: #c4b5fd;
            font-size: clamp(0.7rem, 1.6vh, 0.95rem);
            margin-top: 8px;
            letter-spacing: 1px;
            font-weight: 300;
        }
        .header .sub i { color: #d4af37; margin-right: 6px; }
        /* 語言切換 */
        .lang-switch-group {
            display: flex; justify-content: center; gap: 0;
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 24px;
            padding: 3px;
            margin-top: 14px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .lang-btn {
            background: transparent; border: none;
            color: rgba(224, 232, 245, 0.4);
            font-size: clamp(0.5rem, 1.2vh, 0.8rem);
            padding: clamp(4px, 0.8vh, 8px) clamp(14px, 2vw, 28px);
            border-radius: 20px;
            cursor: pointer; transition: all 0.2s ease;
            font-weight: 600;
        }
        .lang-btn.active {
            background: #7c3aed;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(124, 58, 237, 0.5);
        }
        /* 表格容器 */
        .table-wrap {
            background: rgba(18, 16, 23, 0.5);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 16px;
            overflow-x: auto;
            padding: 4px 0;
            backdrop-filter: blur(2px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(0.65rem, 1.4vh, 0.9rem);
            min-width: 700px;
        }
        th {
            background: rgba(88, 28, 135, 0.35);
            color: #d4b68a;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 14px 10px;
            text-align: left;
            border-bottom: 2px solid rgba(168, 85, 247, 0.25);
            font-size: clamp(0.55rem, 1.1vh, 0.75rem);
            text-transform: uppercase;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.08);
            vertical-align: middle;
            line-height: 1.5;
            color: #e0e8f5;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(124, 58, 237, 0.06); }
        .col-segment { width: 16%; color: #c4b5fd; font-weight: 400; }
        .col-no { width: 10%; text-align: center; color: #a78bfa; font-weight: 600; }
        .col-link { width: 10%; text-align: center; }
        .col-field { width: 28%; color: #f0e9f1; font-weight: 400; }
        .col-func { width: 36%; color: #d0d8e8; font-weight: 300; font-size: clamp(0.6rem, 1.2vh, 0.8rem); }
        .unit-link {
            display: inline-block;
            background: transparent;
            border: 1px solid rgba(168, 85, 247, 0.35);
            color: #c4b5fd;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: clamp(0.5rem, 1.1vh, 0.7rem);
            text-decoration: none;
            letter-spacing: 1px;
            transition: 0.25s ease;
            white-space: nowrap;
            font-weight: 500;
        }
        .unit-link:hover {
            background: #d4b68a;
            color: #0b0a0f;
            border-color: #d4b68a;
            box-shadow: 0 0 24px rgba(212, 182, 138, 0.15);
            transform: scale(1.02);
        }
        .unit-link i { margin-left: 4px; }
        /* 底部 */
        .footer-note {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid rgba(168, 85, 247, 0.1);
            padding-top: 18px;
        }
        .footer-note .page-info {
            display: block;
            color: #8a7e6b;
            font-size: clamp(0.45rem, 0.9vh, 0.65rem);
            letter-spacing: 1px;
        }
        .footer-note .page-info i { color: #d4af37; margin-right: 4px; }
        /* 行動裝置調整 */
        @media (max-width: 768px) {
            .hud-container { padding: 12px; }
            table { min-width: 550px; font-size: 0.65rem; }
            .col-segment { width: 14%; }
            .col-field { width: 24%; }
            .col-func { width: 32%; }
            .col-link { width: 10%; }
            .unit-link { padding: 3px 10px; font-size: 0.55rem; }
            th, td { padding: 8px 6px; }
        }
        @media (max-width: 480px) {
            .hud-container { padding: 8px; }
            table { min-width: 420px; font-size: 0.55rem; }
            .unit-link { padding: 2px 8px; font-size: 0.5rem; }
            .col-segment { width: 12%; }
            .col-field { width: 22%; }
            .col-func { width: 30%; }
            .col-link { width: 10%; }
            th, td { padding: 6px 4px; }
        }
    </style>
</head>
<body>
    <div class="particle-container"></div>
    <div class="watermark-layer">
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
    </div>

    <div class="hud-container">
        <div class="header">
            <h1><i class="fa-solid fa-seal"></i> <span id="mainTitle">【宇宙誓印覺醒工程 • 七印誓網】啟動入口</span></h1>
            <div class="sub" id="subTitle"><i class="fa-solid fa-scroll"></i> <span id="subText">📜 對應級距項目 × 解鎖誓魂血脈身分記載歷程程序 第一層級距誓魂定位模組</span></div>
            <div class="lang-switch-group">
                <button class="lang-btn active" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
                <button class="lang-btn" data-lang="en" onclick="switchLanguage('en')">English</button>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th class="col-segment" id="thSegment">分段</th>
                        <th class="col-no" id="thNo">編號</th>
                        <th class="col-link" id="thLink">連結</th>
                        <th class="col-field" id="thField">欄位名稱</th>
                        <th class="col-func" id="thFunc">功能簡要說明</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 由 JavaScript 動態產生 -->
                </tbody>
            </table>
        </div>
        <div class="footer-note">
            <span class="page-info" id="pageInfo"><i class="fa-regular fa-file-lines"></i> 【宇宙誓印覺醒工程 · 覺醒卷】第 161-162 頁</span>
        </div>
    </div>

    <script>
        // ================================================================
        // 1. 資料定義（中英文完整獨立）
        // ================================================================
        var stepData = {
            zh: {
                mainTitle: '【宇宙誓印覺醒工程 • 七印誓網】啟動入口',
                subText: '📜 對應級距項目 × 解鎖誓魂血脈身分記載歷程程序 第一層級距誓魂定位模組',
                thSegment: '分段',
                thNo: '編號',
                thLink: '連結',
                thField: '欄位名稱',
                thFunc: '功能簡要說明',
                pageInfo: '📄 【宇宙誓印覺醒工程 · 覺醒卷】第 161-162 頁',
                items: [
                    { segment: '—', no: '第0項', field: '宇宙智能誓導平台 × 【購書序號】誓導碼登入與啟動守則', func: '平台登入與啟動之總綱守則，規範誓印者進入誓導系統之基本程序與身份驗證要件。', link: 'step0.html' },
                    { segment: '身份啟動與資格檢核', no: '第1項', field: '開啟誓魂密鑰對頻總判定（誓印通過）', func: '判斷誓魂是否對應至七印誓網模組合法身份，並確認是否具備進入系統通行資格。', link: 'step1.html' },
                    { segment: '身份啟動與資格檢核', no: '第1-1項', field: '開啟誓魂密鑰對頻總判定（誓印未通過）', func: '誓魂尚未與七印誓網模組形成合法對位，其誓魂識別碼無法進入系統主軸，必須依照所提供的指引進行重新對位或調整誓頻，之後才能再次進行頻率判定。', link: 'step1-1.html' },
                    { segment: '代理資訊與功德紀錄', no: '第2項', field: '被代理誓印（法定全名）', func: '登錄被代理誓印（法定全名），以便比對靈脈、誓資及功德對應關係。', link: 'step2.html' },
                    { segment: '代理資訊與功德紀錄', no: '第3項', field: '代理誓印（法定全名）× 功德紀錄', func: '由 ×× 代理誓印（法定全名）代理誓令主尊授權 × 封印誓軌 × 歸位天庫 × 功德紀錄。', link: 'step3.html' },
                    { segment: '血脈與角色定位', no: '第4項', field: '誓魂本族 × 天族姓脈 × 所屬靈系支系 × 角色階級', func: '誓魂最初來源的宇宙族系，誓魂所屬的天界血脈姓氏，對應的功能靈系分支，系統中的任務身份。', link: 'step4.html' },
                    { segment: '血脈與角色定位', no: '第5項', field: '誓魂宇宙位階 × 維度階級 × 三界屬域 × 階級量盤', func: '誓魂宇宙原點 × 維度振頻 × 維度階級 × 九界歸屬屬域 × 所屬階級之全域定位記載。', link: 'step5.html' },
                    { segment: '誓魂狀態', no: '第6項', field: '覺醒程度', func: '誓魂對天命意識之開啟狀態：未覺 × 初醒 × 高頻 × 圓滿等級。', link: 'step6.html' }
                ]
            },
            en: {
                mainTitle: '【Cosmic Vow-Seal Awakening Project • Seven-Seal Vow Network】Launch Entry Point',
                subText: '📜 Corresponding Tier Items × Oath-Soul Bloodline Identity-Unlocking Record Protocol First-Tier Oath-Soul Resolving Module',
                thSegment: 'Segment',
                thNo: 'No.',
                thLink: 'Link',
                thField: 'Field Name',
                thFunc: 'Function Summary',
                pageInfo: '📄 【Cosmic Oath Awakening Project · Awakening Scroll】Pages 161-162',
                items: [
                    { segment: '—', no: 'Item 0', field: 'Cosmic Intelligent Vow-Guidance Platform × [Purchase Serial Number] Vow-Guidance Code Login and Activation Protocol', func: 'General protocol for platform login and activation, defining the basic procedures and identity verification requirements for oath-bearers to enter the vow-guidance system.', link: 'step0.html' },
                    { segment: 'Identity Activation and Qualification Verification', no: 'Item 1', field: 'Initiate Oath-Soul Key Frequency-Alignment Overall Assessment (Oath Seal Passed)', func: 'Determines whether the Oath-Soul corresponds to a valid identity within the Seven-Seal Vow Network and whether it holds the authorization to enter the main Oath-Resource System.', link: 'step1.html' },
                    { segment: 'Identity Activation and Qualification Verification', no: 'Item 1-1', field: 'Initiate Oath-Soul Key Frequency-Alignment Overall Assessment (Oath Seal Not Passed)', func: 'The Oath-Soul has not formed lawful Alignment with the Seven-Seal Vow Network Module. Its Oath-Soul Identification Code cannot enter the system\'s primary axis and must follow the provided guidance to realign or adjust the vow-frequency before undergoing frequency assessment again.', link: 'step1-1.html' },
                    { segment: 'Proxy Information and Merit Records', no: 'Item 2', field: 'Delegated Oath-Seal (Legal Full Name)', func: 'Registers the Delegated Oath-Seal (Legal Full Name) for lineage verification, Oath-Resource matching, and merit-record correlation.', link: 'step2.html' },
                    { segment: 'Proxy Information and Merit Records', no: 'Item 3', field: 'Delegating Oath-Seal (Legal Full Name) × Merit Record', func: 'By ×× acting as Delegating Oath-Seal (Legal Full Name), with authorization granted by the Scriptural-Command Sovereign × Seal-Track Registration × Heavenly Treasury Return × Merit Record.', link: 'step3.html' },
                    { segment: 'Bloodline and Role Designation', no: 'Item 4', field: 'Oath-Soul Origin Claim × Heavenly Clan Lineage × Associated Luminous-Lineage Branch × Role Rank', func: 'Records the Oath-Soul\'s primordial cosmic clan, Heavenly bloodline surname, corresponding functional spiritual system, and operational role within the structure.', link: 'step4.html' },
                    { segment: 'Bloodline and Role Designation', no: 'Item 5', field: 'Oath-Soul Cosmic Master Coordinate × Dimensional Rank × Nine-Realm Domains × Hierarchic Cognition', func: 'Consolidates the Oath-Soul\'s universal origin-point, dimensional frequency, dimensional tier, three-realm classification domain, and hierarchical grade for full-spectrum identity mapping.', link: 'step5.html' },
                    { segment: 'Awakening State', no: 'Item 6', field: 'Awakening Level', func: 'Indicates the Oath-Soul\'s level of destiny-awareness activation: Unawakened × Initial × High-Frequency × Complete.', link: 'step6.html' }
                ]
            }
        };

        // ================================================================
        // 2. 語言切換邏輯
        // ================================================================
        var currentLang = 'zh';

        function renderTable(lang) {
            var data = stepData[lang] || stepData.zh;
            var tbody = document.getElementById('tableBody');
            if (!tbody) return;
            var html = '';
            var items = data.items;
            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                html += '<tr>';
                html += '<td class="col-segment">' + item.segment + '</td>';
                html += '<td class="col-no">' + item.no + '</td>';
                html += '<td class="col-link"><a href="' + item.link + '" class="unit-link">進入 <i class="fa-solid fa-arrow-right"></i></a></td>';
                html += '<td class="col-field">' + item.field + '</td>';
                html += '<td class="col-func">' + item.func + '</td>';
                html += '</tr>';
            }
            tbody.innerHTML = html;
        }

        function switchLanguage(lang) {
            currentLang = lang;
            var data = stepData[lang] || stepData.zh;

            // 更新按鈕狀態
            var btns = document.querySelectorAll('.lang-btn');
            btns.forEach(function(btn) {
                btn.classList.remove('active');
                if (btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                }
            });

            // 更新標題與表格
            document.getElementById('mainTitle').textContent = data.mainTitle;
            document.getElementById('subText').textContent = data.subText;
            document.getElementById('thSegment').textContent = data.thSegment;
            document.getElementById('thNo').textContent = data.thNo;
            document.getElementById('thLink').textContent = data.thLink;
            document.getElementById('thField').textContent = data.thField;
            document.getElementById('thFunc').textContent = data.thFunc;
            document.getElementById('pageInfo').innerHTML = data.pageInfo;

            renderTable(lang);
        }

        // ================================================================
        // 3. 初始化
        // ================================================================
        window.onload = function() {
            switchLanguage('zh');
        };

        // 暴露切換函數給全局
        window.switchLanguage = switchLanguage;
    </script>
</body>
</html>
