<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【宇宙誓印覺醒工程 · 七印誓網】啟動入口</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', 'Share Tech Mono', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #06122c 0%, #020715 100%);
            min-height: 100vh;
            color: #e0e8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(8px, 2vh, 24px);
        }

        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(#d4af37, rgba(212, 175, 55, .3) 1px, transparent 30px),
                radial-gradient(#d4af37, rgba(212, 175, 55, .2) 2px, transparent 40px);
            background-size: 350px 350px, 450px 450px;
            background-position: 0 0, 90px 150px;
            animation: starMove 90s linear infinite;
            opacity: 0.65;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes starMove {
            from {
                transform: translateY(0px) rotate(0deg);
            }
            to {
                transform: translateY(-1000px) rotate(360deg);
            }
        }

        .hud-container {
            width: 100%;
            max-width: min(1200px, 98vw);
            background: rgba(4, 13, 33, 0.4);
            border: 1.5px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.15), inset 0 0 20px rgba(168, 85, 247, 0.05);
            border-radius: clamp(16px, 4vw, 28px);
            padding: clamp(16px, 3vh, 36px);
            position: relative;
            z-index: 10;
        }

        .hud-container::after {
            content: "";
            position: absolute;
            top: 18px;
            right: 18px;
            width: 14px;
            height: 14px;
            border-top: 3px solid #a78bfa;
            border-right: 3px solid #a78bfa;
            pointer-events: none;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: clamp(1.2rem, 3.2vh, 2rem);
            font-weight: 700;
            color: #e9d5ff;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            letter-spacing: 2px;
            line-height: 1.4;
        }

        .header h1 i {
            color: #a78bfa;
            margin-right: 8px;
        }

        .header .sub {
            color: #c4b5fd;
            font-size: clamp(0.7rem, 1.6vh, 0.95rem);
            margin-top: 8px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .header .sub i {
            color: #d4af37;
            margin-right: 6px;
        }

        .lang-switch-group {
            display: flex;
            justify-content: center;
            gap: 0;
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 24px;
            padding: 3px;
            margin-top: 14px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: rgba(224, 232, 245, 0.4);
            font-size: clamp(0.5rem, 1.2vh, 0.8rem);
            padding: clamp(4px, 0.8vh, 8px) clamp(14px, 2vw, 28px);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .lang-btn.active {
            background: #7c3aed;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(124, 58, 237, 0.5);
        }

        /* 模組標題分隔 */
        .module-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 28px 0 16px 0;
            padding: 12px 0;
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
        }

        .module-divider .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(168, 85, 247, 0.3), transparent);
        }

        .module-divider .label {
            font-size: clamp(0.8rem, 1.8vh, 1.1rem);
            font-weight: 700;
            color: #d4b68a;
            letter-spacing: 2px;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(212, 182, 138, 0.15);
            padding: 0 16px;
        }

        .module-divider .label i {
            color: #d4af37;
            margin-right: 8px;
        }

        .module-divider .label.en {
            color: #a78bfa;
        }

        .module-divider .label.en i {
            color: #a78bfa;
        }

        .table-wrap {
            background: rgba(18, 16, 23, 0.5);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 16px;
            overflow-x: auto;
            padding: 4px 0;
            backdrop-filter: blur(2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(0.6rem, 1.3vh, 0.85rem);
            min-width: 800px;
        }

        th {
            background: rgba(88, 28, 135, 0.35);
            color: #d4b68a;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 12px 10px;
            text-align: left;
            border-bottom: 2px solid rgba(168, 85, 247, 0.25);
            font-size: clamp(0.5rem, 1vh, 0.7rem);
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        td {
            padding: 10px 10px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.06);
            vertical-align: middle;
            line-height: 1.5;
            color: #e0e8f5;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(124, 58, 237, 0.06);
        }

        .col-segment {
            width: 14%;
            color: #c4b5fd;
            font-weight: 400;
            font-size: clamp(0.5rem, 1.1vh, 0.7rem);
            border-left: 3px solid transparent;
            padding-left: 10px;
        }

        .col-no {
            width: 10%;
            text-align: center;
            color: #a78bfa;
            font-weight: 600;
            font-size: clamp(0.5rem, 1.1vh, 0.75rem);
        }

        .col-link {
            width: 8%;
            text-align: center;
        }

        .col-field {
            width: 28%;
            color: #f0e9f1;
            font-weight: 400;
            font-size: clamp(0.55rem, 1.2vh, 0.8rem);
        }

        .col-func {
            width: 40%;
            color: #d0d8e8;
            font-weight: 300;
            font-size: clamp(0.5rem, 1.1vh, 0.75rem);
        }

        .unit-link {
            display: inline-block;
            background: transparent;
            border: 1px solid rgba(168, 85, 247, 0.35);
            color: #c4b5fd;
            padding: 3px 12px;
            border-radius: 40px;
            font-size: clamp(0.45rem, 1vh, 0.65rem);
            text-decoration: none;
            letter-spacing: 1px;
            transition: 0.25s ease;
            white-space: nowrap;
            font-weight: 500;
        }

        .unit-link:hover {
            background: #d4b68a;
            color: #0b0a0f;
            border-color: #d4b68a;
            box-shadow: 0 0 24px rgba(212, 182, 138, 0.15);
            transform: scale(1.02);
        }

        .unit-link i {
            margin-left: 4px;
        }

        .footer-note {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid rgba(168, 85, 247, 0.1);
            padding-top: 18px;
        }

        .footer-note .page-info {
            display: block;
            color: #8a7e6b;
            font-size: clamp(0.45rem, 0.9vh, 0.65rem);
            letter-spacing: 1px;
        }

        .footer-note .page-info i {
            color: #d4af37;
            margin-right: 4px;
        }

        @media (max-width: 768px) {
            .hud-container {
                padding: 10px;
            }
            table {
                min-width: 600px;
                font-size: 0.6rem;
            }
            .col-segment {
                width: 12%;
            }
            .col-field {
                width: 24%;
            }
            .col-func {
                width: 36%;
            }
            .col-link {
                width: 8%;
            }
            .unit-link {
                padding: 2px 8px;
                font-size: 0.5rem;
            }
            th,
            td {
                padding: 6px 6px;
            }
            .module-divider .label {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 480px) {
            .hud-container {
                padding: 6px;
            }
            table {
                min-width: 480px;
                font-size: 0.5rem;
            }
            .unit-link {
                padding: 2px 6px;
                font-size: 0.45rem;
            }
            .col-segment {
                width: 10%;
            }
            .col-field {
                width: 22%;
            }
            .col-func {
                width: 34%;
            }
            .col-link {
                width: 8%;
            }
            th,
            td {
                padding: 4px 4px;
            }
            .module-divider .label {
                font-size: 0.6rem;
                padding: 0 8px;
            }
        }
    </style>
</head>

        // ================================================================
        // 渲染函數
        // ================================================================
        function renderTable(tbodyId, data, lang) {
            var tbody = document.getElementById(tbodyId);
            if (!tbody) return;
            var html = '';
            var items = data.items;
            var linkText = (lang === 'en') ? 'Enter' : '進入';

            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var color = segmentColors[item.segment] || '#a78bfa';
                html += '<tr>';
                html += '<td class="col-segment" style="border-left-color:' + color + ';">' + item.segment + '</td>';
                html += '<td class="col-no">' + item.no + '</td>';
                html += '<td class="col-link"><a href="' + item.link + '" class="unit-link">' + linkText +
                    ' <i class="fa-solid fa-arrow-right"></i></a></td>';
                html += '<td class="col-field">' + item.field + '</td>';
                html += '<td class="col-func">' + item.func + '</td>';
                html += '</tr>';
            }
            tbody.innerHTML = html;
        }

        // 語言切換
        // ================================================================
        var currentLang = 'zh';

        function switchLanguage(lang) {
            currentLang = lang;

            var btns = document.querySelectorAll('.lang-btn');
            btns.forEach(function(btn) {
                btn.classList.remove('active');
                if (btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                }
            });

            // 第一層級距
            var d1 = level1Data[lang] || level1Data.zh;
            document.getElementById('module1Label').innerHTML = '<i class="fa-solid fa-layer-group"></i> ' + d1.moduleLabel;

            document.getElementById('thField').textContent = d1.thField;
            document.getElementById('thFunc').textContent = d1.thFunc;
