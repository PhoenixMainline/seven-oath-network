<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全球啟動流程 · 宇宙誓印覺醒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #156082;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            position: relative;
            overflow-x: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .watermark-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-gap: 80px 40px;
            padding: 40px;
            overflow: hidden;
            opacity: 0.05;
        }

        .watermark-text {
            color: #FFC000;
            font-size: 1.5rem;
            font-weight: 900;
            white-space: nowrap;
            transform: rotate(-25deg);
            user-select: none;
            text-align: center;
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            background: #156082;
            border-radius: 48px;
            border: 1px solid rgba(255, 192, 0, 0.25);
            box-shadow: 0 20px 60px rgba(10, 30, 50, 0.4);
            padding: 28px 24px 32px;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 192, 0, 0.15);
            padding-bottom: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #FFC000;
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px #FFC00033;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-toggle {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 40px;
            border: 1px solid rgba(255, 192, 0, 0.15);
        }
        .lang-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
        }
        .lang-btn.active {
            background: #FFC000;
            color: #0A060E;
        }

        .btn-home {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 192, 0, 0.15);
            color: #FFC000;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .main-title {
            text-align: center;
            color: #FFC000;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-shadow: 0 0 30px #FFC00033;
            margin-bottom: 8px;
        }

        .start-btn-wrapper {
            text-align: center;
            margin: 16px 0 28px;
        }

        .btn-start {
            background: #827717;
            border: none;
            color: #fff;
            font-weight: 800;
            padding: 16px 48px;
            border-radius: 60px;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.2);
            letter-spacing: 3px;
        }

        .step-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: transparent;
            padding: 14px 20px;
            border-radius: 20px;
            border-left: 4px solid rgba(255, 192, 0, 0.20);
        }

        .step-item.active {
            background: rgba(255, 192, 0, 0.08);
            border-left-color: #FFC000;
        }

        .step-item.locked {
            opacity: 0.3;
        }

        .step-number {
            font-size: 1.3rem;
            font-weight: 900;
            color: #FFC000;
            min-width: 44px;
            text-align: center;
        }
        .step-content {
            flex: 1;
            text-align: left;
        }
        .step-label {
            color: #f0e8d8;
            font-size: 1rem;
            font-weight: 600;
        }
        .step-desc {
            color: #b0a898;
            font-size: 0.85rem;
            margin-top: 2px;
            opacity: 0.7;
        }

        #scanner {
            background: rgba(10, 30, 50, 0.3);
            border: 1px solid rgba(255, 192, 0, 0.25);
            border-radius: 24px;
            padding: 24px;
            margin: 15px 0;
            text-align: center;
        }
        
        .scan-title {
            color: #FFC000;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .scan-error-msg {
            color: #00e5ff;
            font-weight: bold;
            font-size: 1rem;
            margin: 10px 0;
        }

        .status-msg {
            color: #FFC000;
            font-weight: 600;
            text-align: center;
            margin: 18px 0 10px;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .footer-note {
            margin-top: 28px;
            text-align: right;
            color: #FFC000;
            font-size: 0.8rem;
            opacity: 0.3;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255,192,0,0.08);
            padding-top: 16px;
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>
    
    <div class="watermark-container">
        <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
        <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
        <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
        <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
    </div>

    <div class="app-container">
        <div class="app-header">
            <div class="app-title">宇宙誓印覺醒工程</div>
            <div class="header-actions">
                <button class="btn-home">🏠 回到首頁</button>
                <div class="lang-toggle">
                    <button class="lang-btn active">中文</button>
                    <button class="lang-btn">English</button>
                </div>
            </div>
        </div>

        <div class="main-title">全球啟動流程</div>

        <div class="start-btn-wrapper">
            <button class="btn-start">⚡ 啟動中 ...</button>
        </div>

        <div id="scanner">
            <div class="scan-title">📷 請對準母頻 QR Code 驗證</div>
            <div class="scan-error-msg">相機開啟失敗，請確認授權權限。</div>
        </div>

        <div class="step-list">
            <div class="step-item">
                <div class="step-number">[1]</div>
                <div class="step-content">
                    <div class="step-label">啟動條件</div>
                    <div class="step-desc">啟動前置準備完成</div>
                </div>
            </div>
            <div class="step-item">
                <div class="step-number">[2]</div>
                <div class="step-content">
                    <div class="step-label">授權誓讀階段</div>
                    <div class="step-desc">誓印者讀誓文，啟動主頻</div>
                </div>
            </div>
            <div class="step-item active">
                <div class="step-number">[3]</div>
                <div class="step-content">
                    <div class="step-label">母頻驗證（掃碼）</div>
                    <div class="step-desc">輸入購書序號，觸發母頻對接</div>
                </div>
            </div>
            <div class="step-item locked">
                <div class="step-number">[4]</div>
                <div class="step-content">
                    <div class="step-label">回傳結果</div>
                    <div class="step-desc">系統完成驗證回傳啟動語</div>
                </div>
            </div>
            <div class="step-item locked">
                <div class="step-number">[5]</div>
                <div class="step-content">
                    <div class="step-label">誓頻啟動 × 系統同步</div>
                    <div class="step-desc">主頻定位 × 對接同步完成</div>
                </div>
            </div>
        </div>

        <p class="status-msg">請掃描 QR Code 驗證</p>

        <div class="footer-note">📄 【宇宙誓印覺醒工程 · 覺醒卷】：第 1-2 頁</div>
    </div>

    <script>
        (function() {
            function initParticles() {
                const canvas = document.getElementById('particles-canvas');
                const ctx = canvas.getContext('2d');
                let w, h;
                const particles = [];

                function resize() {
                    w = canvas.width = window.innerWidth;
                    h = canvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                for (let i = 0; i < 110; i++) {
                    particles.push({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight,
                        size: Math.random() * 2.2 + 0.6,
                        speedX: (Math.random() - 0.5) * 0.3,
                        speedY: (Math.random() - 0.5) * 0.3,
                        color: `rgba(255, 192, 0, ${Math.random() * 0.5 + 0.2})`
                    });
                }

                function animate() {
                    ctx.clearRect(0, 0, w, h);
                    particles.forEach(p => {
                        p.x += p.speedX; p.y += p.speedY;
                        if (p.x < 0 || p.x > w) p.speedX *= -1;
                        if (p.y < 0 || p.y > h) p.speedY *= -1;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                    });

                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
                            if (dist < 150) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(255, 192, 0, ${0.04 * (1 - dist / 150)})`;
                                ctx.lineWidth = 0.6;
                                ctx.stroke();
                            }
                        }
                    }
                    requestAnimationFrame(animate);
                }
                animate();
            }
            initParticles();
        })();
    </script>
</body>
</html>
