<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙誓印覺醒工程 • 七印誓網</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background: radial-gradient(circle,#0A060E,#000);
    color:#FFC000;
    overflow-x:hidden;
}

/* 浮水印 */
body::after{
    content:"天地為鑑，光網為證";
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:40px;
    color:rgba(255,255,255,0.05);
    pointer-events:none;
}

/* header */
.header{
    text-align:center;
    padding:15px;
    font-weight:bold;
}

/* 語言 */
.lang{
    position:absolute;
    right:10px;
    top:10px;
}

/* 卡片 */
.card{
    background:rgba(255,255,255,0.05);
    margin:15px;
    padding:15px;
    border-radius:10px;
}

/* 宣告式 */
.oath{
    font-size:21px;
    color:#D4AF37;
    font-weight:bold;
    text-align:center;
    margin-bottom:15px;
}

/* 按鈕 */
button{
    background:#E8604A;
    border:none;
    padding:12px;
    color:#fff;
    border-radius:6px;
    margin:5px;
    width:100%;
}

button:disabled{
    opacity:0.4;
}

/* QR */
#reader{width:250px;margin:auto;}

.page{
    display:none;
}

.active{
    display:block;
}

/* 頁碼 */
.pageNum{
    text-align:right;
    margin:10px;
    font-size:12px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="header" id="appTitle"></div>

<div class="lang">
    <button onclick="setLang('zh')">中文</button>
    <button onclick="setLang('en')">English</button>
</div>

<!-- STEP -->
<div id="app"></div>

<script>
const APP_NAME = {
    zh:"宇宙誓印覺醒工程 • 七印誓網",
    en:"Cosmic Oath Awakening Project · Seven-Seal Oath Network"
};

const pages = [
    {p:"3-4"}, {p:"3-4"}, {p:"5-6"}, {p:"7-8"}, {p:"9-10"}
];

const text = {
zh:{
start:"開始啟動",
next:"進入下一步",
scan:"掃描 QR Code",
done:"已完成誦讀",
count:"請靜心誦讀",
cameraErr:`📷 無法啟動相機

⚙️ 開啟手機「設定」
→ 應用程式管理
→ 權限 → 相機 → 改為「允許」
→ 使用 🌐 瀏覽器開啟

⚠️ 若仍無法使用，請手動掃描`,
oath:"★ 吾以誓魂應律，主頻啟、書命立、印軌定，天地為鑑，光網為證。★"
},
en:{
start:"Start",
next:"Next",
scan:"Scan QR Code",
done:"Recitation complete",
count:"Please center your mind and recite",
cameraErr:`📷 Unable to start camera

⚙️ Open phone Settings
→ App Management
→ Permissions → Camera → Allow
→ Open in browser

⚠️ If still not working, scan manually`,
oath:"★ With my Oath-Soul aligned to the Law..."
}
};

let lang="zh";
let step=0;

function setLang(l){
    lang=l;
    render();
}

/* 頁碼 */
function pageLabel(i){
    if(lang==="zh"){
        return `📄 【宇宙誓印覺醒工程 • 覺醒卷】：第 ${pages[i].p} 頁`;
    }else{
        return `📄 【Cosmic Oath Awakening Project • Awakening Scroll】: Pages ${pages[i].p}`;
    }
}

/* 主 render */
function render(){
    document.getElementById("appTitle").innerText=APP_NAME[lang];

    const app=document.getElementById("app");
    app.innerHTML="";

    let html="";

    /* STEP 2 特殊 */
    if(step===1){
        html+=`
        <div class="card">
            <div class="oath">${text[lang].oath}</div>
            <div id="timer">${text[lang].count} 10</div>
        </div>
        <div class="card">
            <button id="nextBtn" disabled>${text[lang].next}</button>
        </div>
        `;
    }
    /* QR 步驟 */
    else if(step===0||step===2||step===3){
        html+=`
        <div class="card">
            <button onclick="startQR()">${text[lang].scan}</button>
            <div id="reader"></div>
            <div id="result"></div>
        </div>
        <button id="nextBtn" disabled>${text[lang].next}</button>
        `;
    }
    else{
        html+=`
        <button onclick="nextStep()">${text[lang].next}</button>
        `;
    }

    html+=`<div class="pageNum">${pageLabel(step)}</div>`;

    app.innerHTML=html;

    /* step2 timer */
    if(step===1) startTimer();
}

/* 倒數 */
function startTimer(){
    let t=10;
    const el=document.getElementById("timer");
    const btn=document.getElementById("nextBtn");

    const interval=setInterval(()=>{
        t--;
        el.innerText=text[lang].count+" "+t;

        if(t<=0){
            clearInterval(interval);
            el.innerText=text[lang].done;
            btn.disabled=false;
            btn.onclick=nextStep;
        }
    },1000);
}

/* QR */
function startQR(){
    try{
        const qr=new Html5Qrcode("reader");

        qr.start(
            {facingMode:"environment"},
            {fps:10,qrbox:200},
            txt=>{
                document.getElementById("result").innerText=txt;
                localStorage.setItem("step"+step,txt);
                document.getElementById("nextBtn").disabled=false;
                qr.stop();
            }
        );
    }catch(e){
        alert(text[lang].cameraErr);
    }
}

/* 下一步 */
function nextStep(){
    step++;
    localStorage.setItem("progress",step);
    render();
}

/* 初始化 */
step=parseInt(localStorage.getItem("progress"))||0;
render();
</script>

</body>
</html>
