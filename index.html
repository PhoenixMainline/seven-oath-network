<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【宇宙誓印覺醒工程 · 七印誓網】</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        /* ===== 基礎重置 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', 'Share Tech Mono', sans-serif;
        }

        /* ===== 宇宙背景 ===== */
        body {
            background: radial-gradient(circle at 50% 50%, #06122c 0%, #020715 100%);
            min-height: 100vh;
            height: 100vh;
            color: #e0e8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: clamp(4px, 1.5vh, 16px);
        }

        /* ===== 粒子流動層 ===== */
        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                radial-gradient(#d4af37, rgba(212, 175, 55, .3) 1px, transparent 30px),
                radial-gradient(#d4af37, rgba(212, 175, 55, .2) 2px, transparent 40px);
            background-size: 350px 350px, 450px 450px;
            background-position: 0 0, 90px 150px;
            animation: starMove 90s linear infinite;
            opacity: 0.65;
            z-index: 5;
            pointer-events: none;
        }
        @keyframes starMove {
            from { transform: translateY(0px) rotate(0deg); }
            to { transform: translateY(-1000px) rotate(360deg); }
        }

        /* ===== 浮水印層 ===== */
        .watermark-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0.04;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            padding: 50px;
        }
        .watermark-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            transform: rotate(-25deg);
            white-space: nowrap;
            user-select: none;
        }

        /* ===== 主容器 ===== */
        .hud-container {
            width: 100%;
            max-width: min(660px, 95vw);
            max-height: min(98vh, 800px);
            background: rgba(4, 13, 33, 0.4);
            border: 1.5px solid rgba(0, 191, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 191, 255, 0.15), inset 0 0 20px rgba(0, 191, 255, 0.05);
            border-radius: clamp(16px, 4vw, 28px);
            padding: clamp(12px, 3vh, 35px);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 3;
            margin: clamp(4px, 1.5vh, 20px) auto;
            overflow-y: auto;
        }
        .hud-container::after {
            content: "";
            position: absolute;
            top: 18px;
            right: 18px;
            width: 14px;
            height: 14px;
            border-top: 3px solid #00bfff;
            border-right: 3px solid #00bfff;
            pointer-events: none;
        }

        /* ===== 回到首頁按鈕 ===== */
        .home-breadcrumb {
            font-size: clamp(0.6rem, 1.4vh, 0.85rem);
            color: #00bfff;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            font-weight: bold;
            align-self: flex-start;
            transition: all 0.3s ease;
            text-shadow: 0 0 8px rgba(0, 191, 255, 0.4);
            position: relative;
            z-index: 1000;
            pointer-events: auto !important;
        }
        .home-breadcrumb:hover {
            color: #d4af37;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
            transform: translateX(-2px);
        }

        /* ===== 頁首 ===== */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 191, 255, 0.15);
            padding-bottom: clamp(8px, 1.5vh, 18px);
            margin-bottom: clamp(8px, 1.5vh, 25px);
        }
        .app-title {
            font-size: clamp(0.9rem, 2.2vh, 1.15rem);
            font-weight: 700;
            color: #d4af37;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
            max-width: 75%;
            line-height: 1.4;
        }
        .lang-switch-group {
            display: flex;
            background: rgba(0, 191, 255, 0.08);
            border: 1px solid rgba(0, 191, 255, 0.25);
            border-radius: 20px;
            padding: 2px;
            z-index: 10;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: rgba(224, 232, 245, 0.4);
            font-size: clamp(0.5rem, 1.2vh, 0.75rem);
            padding: clamp(2px, 0.6vh, 5px) clamp(6px, 1vw, 12px);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-btn.active {
            background: #00bfff;
            color: #020611;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.4);
        }

        /* ===== 導航欄 ===== */
        .flow-nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: clamp(3px, 0.6vw, 6px);
            margin-bottom: clamp(8px, 1.5vh, 30px);
        }
        .flow-node {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: clamp(3px, 0.8vh, 8px) clamp(2px, 0.5vw, 6px);
            text-align: center;
            font-size: clamp(0.45rem, 1.2vh, 0.72rem);
            color: rgba(224, 232, 245, 0.35);
            transition: all 0.3s ease;
        }
        .flow-node.active {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid #d4af37;
            color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
            font-weight: bold;
        }

        /* ===== 步驟內容 ===== */
        .step-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.5vh, 22px);
        }
        .step-panel {
            display: none;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.4s ease-in-out;
        }
        .step-panel.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 卡片 ===== */
        .hud-card {
            background: rgba(6, 18, 44, 0.3);
            border: 1px solid rgba(0, 191, 255, 0.12);
            border-radius: clamp(10px, 2vw, 16px);
            padding: clamp(10px, 2vh, 24px) clamp(10px, 2vw, 24px);
        }
        .card-title {
            font-size: clamp(0.9rem, 2vh, 1.2rem);
            color: #d4af37;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== 啟動條件清單 ===== */
        .condition-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .condition-item {
            display: flex;
            align-items: flex-start;
            gap: clamp(6px, 1vw, 12px);
            font-size: clamp(0.7rem, 1.6vh, 0.95rem);
            line-height: 1.6;
            color: rgba(224, 232, 245, 0.85);
        }
        .condition-item i.check-icon {
            color: #00e676;
            margin-top: 4px;
            text-shadow: 0 0 8px rgba(0, 230, 118, 0.3);
        }

        /* ===== 宣告式 ===== */
        .proclamation-text {
            font-size: clamp(14px, 2.2vh, 21px);
            color: #D4AF37;
            font-weight: bold;
            text-align: center;
            line-height: 1.6;
            margin-bottom: clamp(8px, 1.5vh, 24px);
            padding: clamp(4px, 1vh, 12px);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* ===== 計時器 ===== */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 1vh, 12px);
            padding: clamp(8px, 1.5vh, 20px);
            background: rgba(212, 175, 55, 0.04);
            border: 1px dashed rgba(212, 175, 55, 0.25);
            border-radius: 12px;
        }
        .timer-label {
            font-size: clamp(0.7rem, 1.4vh, 1rem);
            color: rgba(224, 232, 245, 0.7);
            min-width: clamp(50px, 8vw, 80px);
        }
        .timer-number {
            font-size: clamp(1.8rem, 5vh, 2.5rem);
            font-family: 'Share Tech Mono', sans-serif;
            color: #00bfff;
            text-shadow: 0 0 15px rgba(0, 191, 255, 0.6);
            font-weight: 700;
            min-width: clamp(30px, 5vw, 60px);
            text-align: center;
        }
        .timer-number.complete {
            color: #00e676;
            text-shadow: 0 0 20px rgba(0, 230, 118, 0.6);
        }

        /* ===== 執行指令 ===== */
        .instruction-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .instruction-item {
            font-size: clamp(0.7rem, 1.6vh, 0.95rem);
            line-height: 1.6;
            color: rgba(224, 232, 245, 0.85);
            display: flex;
            align-items: flex-start;
            gap: clamp(6px, 1vw, 12px);
        }
        .instruction-item i {
            color: #00e676;
            margin-top: 5px;
        }

        /* ===== 頁尾按鈕 ===== */
        .hud-footer {
            margin-top: clamp(10px, 2vh, 35px);
            padding-top: clamp(8px, 1.5vh, 18px);
            border-top: 1px solid rgba(0, 191, 255, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            flex-wrap: wrap;
        }
        .footer-btn-group {
            display: flex;
            align-items: center;
            gap: clamp(4px, 1vw, 12px);
        }
        .btn-action {
            background: transparent;
            border: 1px solid rgba(0, 191, 255, 0.15);
            color: rgba(0, 191, 255, 0.3);
            padding: clamp(6px, 1.2vh, 10px) clamp(10px, 1.5vw, 22px);
            font-size: clamp(0.65rem, 1.3vh, 0.9rem);
            border-radius: 20px;
            cursor: not-allowed;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            pointer-events: none;
            text-decoration: none;
            min-height: clamp(32px, 5vh, 44px);
        }
        .btn-action.enabled {
            border: 1px solid #00c3ff;
            color: #00d9ff;
            cursor: pointer;
            pointer-events: auto;
            background: rgba(0, 191, 255, 0.05);
            text-shadow: 0 0 10px rgba(0, 195, 255, 0.6);
            box-shadow: 0 0 15px rgba(0, 195, 255, 0.25), inset 0 0 10px rgba(0, 195, 255, 0.1);
        }
        .btn-action.enabled:hover {
            background: rgba(0, 191, 255, 0.15);
            box-shadow: 0 0 25px rgba(0, 195, 255, 0.5), inset 0 0 12px rgba(0, 195, 255, 0.2);
            transform: translateY(-1px);
        }

        /* ===== 頁碼 ===== */
        .page-marker {
            font-size: clamp(0.5rem, 1.2vh, 0.78rem);
            color: rgba(224, 232, 245, 0.35);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== 對話框 ===== */
        .hud-dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 17, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .hud-dialog.active {
            display: flex;
            opacity: 1;
        }
        .hud-dialog-content {
            background: rgba(4, 13, 33, 0.95);
            border: 1.5px solid #00bfff;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.4);
            border-radius: 18px;
            padding: 30px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            position: relative;
        }
        .hud-dialog-text {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #e0e8f5;
        }
        .hud-dialog-btn {
            background: transparent;
            border: 1px solid #00bfff;
            color: #00bfff;
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            text-shadow: 0 0 8px rgba(0, 191, 255, 0.5);
            transition: all 0.2s;
        }
        .hud-dialog-btn:hover {
            background: rgba(0, 191, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.3);
        }

        /* ===== QR Code 掃描 ===== */
        .btn-restart {
            background: linear-gradient(135deg, #d4af37, #b8952e);
            border: none;
            color: #0A060E;
            font-weight: 800;
            padding: clamp(6px, 1.2vh, 12px) clamp(12px, 2vw, 28px);
            font-size: clamp(0.7rem, 1.4vh, 1rem);
            border-radius: clamp(20px, 3vw, 40px);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }
        .btn-restart:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 30px rgba(212, 175, 55, 0.5);
        }

        .btn-start-centering {
            background: linear-gradient(135deg, #d4af37, #b8952e);
            border: none;
            color: #0A060E;
            font-weight: 800;
            padding: clamp(6px, 1.2vh, 12px) clamp(12px, 2vw, 28px);
            font-size: clamp(0.7rem, 1.4vh, 1rem);
            border-radius: clamp(20px, 3vw, 40px);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-start-centering:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 30px rgba(212, 175, 55, 0.5);
        }
        .btn-start-centering:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .qr-result {
            color: #00e676;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0, 230, 118, 0.06);
            border: 1px solid rgba(0, 230, 118, 0.15);
            word-break: break-all;
        }
        .camera-guide {
            background: rgba(232, 96, 74, 0.08);
            border-left: 4px solid #E8604A;
            padding: 14px 16px;
            border-radius: 12px;
            color: #e0dcc8;
            font-size: 0.85rem;
            line-height: 1.8;
            white-space: pre-wrap;
            text-align: left;
        }
        #qr-reader-container video,
        #qr-reader-container-step4 video {
            border-radius: 12px;
            width: 100%;
        }

        /* ===== 手機螢幕極小化修正 ===== */
        @media (max-width: 480px) {
            .hud-container {
                padding: 10px 8px !important;
                border-radius: 16px !important;
                max-height: 98vh !important;
            }
            .hud-header {
                flex-wrap: wrap;
            }
            .app-title {
                font-size: 0.75rem !important;
                max-width: 100% !important;
            }
            .lang-btn {
                font-size: 0.5rem !important;
                padding: 2px 6px !important;
            }
            .home-breadcrumb {
                font-size: 0.55rem !important;
            }
            .flow-node {
                font-size: 0.4rem !important;
                padding: 2px 1px !important;
            }
            .hud-card {
                padding: 8px 6px !important;
            }
            .card-title {
                font-size: 0.7rem !important;
            }
            .condition-item,
            .instruction-item {
                font-size: 0.6rem !important;
            }
            .proclamation-text {
                font-size: 12px !important;
            }
            .timer-number {
                font-size: 1.5rem !important;
            }
            .timer-label {
                font-size: 0.6rem !important;
            }
            .btn-start-centering,
            .btn-restart {
                padding: 4px 10px !important;
                font-size: 0.6rem !important;
            }
            .btn-action {
                padding: 4px 8px !important;
                font-size: 0.55rem !important;
                min-height: 28px !important;
            }
            .page-marker {
                font-size: 0.4rem !important;
            }
            .watermark-text {
                font-size: 0.8rem !important;
            }
        }
    </style>
</head>
<body>

    <!-- 🌌 粒子背景 -->
    <div class="particle-container"></div>

    <!-- 📜 浮水印層 -->
    <div class="watermark-layer">
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
    </div>

    <!-- 🚀 主容器 -->
    <div class="hud-container">
        <a class="home-breadcrumb" id="homeBtn" onclick="returnToHome()">
            <i class="fa-solid fa-house"></i>
            <span id="homeBtnText">首頁 -></span>
        </a>

        <header class="hud-header">
            <div class="app-title" id="appTitle">【宇宙誓印覺醒工程 · 七印誓網】</div>
            <div class="lang-switch-group">
                <button class="lang-btn active" onclick="switchLanguage('zh')">中文</button>
                <button class="lang-btn" onclick="switchLanguage('en')">English</button>
            </div>
        </header>

        <!-- 導航欄 -->
        <nav class="flow-nav">
            <div class="flow-node active" id="node1">[1] 啟動條件</div>
            <div class="flow-node" id="node2">[2] 授權誓讀</div>
            <div class="flow-node" id="node3">[3] 授權綁定</div>
            <div class="flow-node" id="node4">[4] 回傳結果</div>
            <div class="flow-node" id="node5">[5] 系統同步</div>
        </nav>

        <!-- 步驟內容 -->
        <main class="step-content">
