<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球啟動流程</title>

<!-- 掃碼套件 -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family: sans-serif;
    color:#fff;
    overflow:hidden;
    background: #156082; /* 🌌 修改：調成與主卡片一致的深藍綠色背景 */
    position: relative;
}

/* 🌌 修改：宇宙流動粒子畫布樣式 */
#particles-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

/* 🔒 修改：全網頁安全防偽浮水印（不破壞結構、不吃字） */
.watermark-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 999;
    pointer-events: none;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    grid-gap: 80px 40px;
    padding: 40px;
    overflow: hidden;
    opacity: 0.05; /* 質感防偽透明度 */
}

.watermark-text {
    color: #FFC000;
    font-size: 1.5rem;
    font-weight: 900;
    white-space: nowrap;
    transform: rotate(-25deg);
    user-select: none;
    text-align: center;
}

/* UI */
.container{
    max-width:600px;
    margin:auto;
    padding:20px;
    text-align:center;
    position: relative;
    z-index: 10;
}

h1{color:#ffd54f;}

button{
    padding:12px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.start{
    background:linear-gradient(90deg,#ff9800,#ff5722);
    width:100%;
}

.step{
    background:rgba(255,255,255,0.08);
    margin:8px;
    padding:12px;
    border-radius:8px;
}

.active{background:#ffc107;color:#000;}
.locked{opacity:0.3;}

.hidden{display:none;}

#reader{
    width:250px;
    margin:auto;
}

.status{
    margin-top:10px;
    font-size:14px;
}
</style>
</head>

<body>

<!-- 🌌 修改：引入星空宇宙粒子畫布 -->
<canvas id="particles-canvas"></canvas>

<!-- 🔒 修改：引入全網頁防偽浮水印 -->
<div class="watermark-container">
    <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
    <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
    <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
    <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
</div>

<div class="container">

<h1 id="title">全球啟動流程</h1>

<button class="start" id="startBtn">開始啟動</button>

<div id="steps"></div>

<!-- 掃碼 -->
<div id="scanner" class="hidden">
    <h3>QR 驗證</h3>
    <div id="reader"></div>
    <p id="scanResult"></p>
</div>

<p class="status" id="status"></p>

</div>

<script>
/* ===== 🌌 修改：高質感宇宙流動粒子連線引擎 ===== */
function initParticles() {
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    const particles = [];
    const count = 110; // 粒子密度

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * w;
            this.y = Math.random() * h;
            this.size = Math.random() * 2.2 + 0.6;
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.speedY = (Math.random() - 0.5) * 0.3;
            this.opacity = Math.random() * 0.5 + 0.2;
            this.color = `rgba(255, 192, 0, ${this.opacity})`; // 質感金黃色粒子
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > w) this.speedX *= -1;
            if (this.y < 0 || this.y > h) this.speedY *= -1;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
    }

    for (let i = 0; i < count; i++) particles.push(new Particle());

    function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        
        // 繪製神祕的宇宙星網連線
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(255, 192, 0, ${0.04 * (1 - dist / 150)})`;
                    ctx.lineWidth = 0.6;
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animate);
    }
    animate();
}
initParticles();


/* ===== 📋 原版流程與掃碼邏輯 (完全保留) ===== */
const stepsData = [
    "啟動條件",
    "授權誓讀",
    "母頻驗證（掃碼）",
    "回傳結果",
    "最終啟動"
];

let current = -1;

const stepsDiv = document.getElementById("steps");

function renderSteps(){
    stepsDiv.innerHTML="";
    stepsData.forEach((s,i)=>{
        const div=document.createElement("div");
        div.className="step";

        if(i===current) div.classList.add("active");
        if(i>current) div.classList.add("locked");

        div.innerText=`[${i+1}] ${s}`;
        stepsDiv.appendChild(div);
    });
}

/* 開始 */
document.getElementById("startBtn").onclick=()=>{
    current=0;
    renderSteps();
    updateStatus();
};

/* 下一步 */
function nextStep(){
    current++;
    renderSteps();
    updateStatus();
}

/* 狀態 */
function updateStatus(){
    const status=document.getElementById("status");

    if(current===2){
        startScanner();
        status.innerText="請掃描 QR Code 驗證";
    }else if(current>=stepsData.length){
        status.innerText="✅ 啟動完成";
    }else{
        status.innerText="處理中...";
        setTimeout(()=>nextStep(),1000);
    }
}

/* ===== 掃碼 ===== */
function startScanner(){
    document.getElementById("scanner").classList.remove("hidden");

    const qr = new Html5Qrcode("reader");

    qr.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 200 },
        (decodedText)=>{
            document.getElementById("scanResult").innerText =
                "驗證成功: " + decodedText;

            qr.stop();
            document.getElementById("scanner").classList.add("hidden");

            nextStep();
        }
    );
}

/* 初始化 */
renderSteps();
</script>

</body>
</html>
