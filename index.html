<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全球啟動流程 · 宇宙誓印覺醒</title>

    <!-- 掃碼套件 -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #156082; /* 🌌 一致的深藍綠色背景 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            position: relative;
            overflow-x: hidden;
        }

        /* 🌌 宇宙流動的動態粒子畫布 */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 🔒 100% 安全的全螢幕防偽浮水印（覆蓋最上層，不打亂結構） */
        .watermark-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-gap: 80px 40px;
            padding: 40px;
            overflow: hidden;
            opacity: 0.05; /* 質感防偽透明度 */
        }

        .watermark-text {
            color: #FFC000;
            font-size: 1.5rem;
            font-weight: 900;
            white-space: nowrap;
            transform: rotate(-25deg);
            user-select: none;
            text-align: center;
        }

        /* 🛸 中央主卡片（色調與背景完美一致） */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 620px;
            background: #156082; /* 與背景一致 */
            border-radius: 36px;
            border: 1px solid rgba(255, 192, 0, 0.25);
            box-shadow: 0 20px 60px rgba(10, 30, 50, 0.4);
            padding: 32px 24px;
            text-align: center;
        }

        h1 {
            color: #FFC000;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(255, 192, 0, 0.3);
            margin-bottom: 24px;
        }

        h3 {
            color: #FFC000;
            margin-bottom: 12px;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* 🌟 高質感黃金啟動按鈕 */
        button.start {
            background: linear-gradient(135deg, #FFC000, #d4a000);
            border: none;
            color: #0A060E;
            font-weight: 800;
            padding: 16px 48px;
            border-radius: 60px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 30px rgba(255, 192, 0, 0.3);
            letter-spacing: 3px;
            width: 100%;
            margin: 10px 0 20px;
        }

        button.start:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 40px rgba(255, 192, 0, 0.5);
        }

        button.start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }

        /* 📋 流程項目樣式 */
        .step {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: rgba(255, 255, 255, 0.02);
            margin: 12px 0;
            padding: 14px 20px;
            border-radius: 16px;
            border-left: 4px solid rgba(255, 192, 0, 0.15);
            font-size: 1rem;
            font-weight: 600;
            color: #f0e8d8;
            transition: 0.3s ease;
            text-align: left;
        }

        /* ⚡ 正在進行的步驟高亮 */
        .step.active {
            background: rgba(255, 192, 0, 0.12);
            border-left-color: #FFC000;
            color: #FFC000;
            box-shadow: 0 0 15px rgba(255, 192, 0, 0.1);
        }

        /* 🔒 未解鎖步驟 */
        .step.locked {
            opacity: 0.3;
            border-left-color: rgba(255, 255, 255, 0.1);
        }

        .hidden {
            display: none !important;
        }

        /* 🔍 掃碼區塊樣式微調 */
        #scanner {
            background: rgba(10, 30, 50, 0.3);
            border: 1px solid rgba(255, 192, 0, 0.2);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
        }

        #reader {
            width: 100%;
            max-width: 280px;
            margin: 15px auto;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 192, 0, 0.3) !important;
        }

        #scanResult {
            color: #00e5ff;
            font-weight: bold;
            margin-top: 8px;
        }

        .status {
            margin-top: 20px;
            font-size: 0.95rem;
            color: #FFC000;
            letter-spacing: 1px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- 🌌 星空宇宙粒子背景 -->
    <canvas id="particles-canvas"></canvas>

    <!-- 🔒 「天地為鑑，光網為證」全網頁防偽浮水印 -->
    <div class="watermark-container">
        <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
        <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
        <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
        <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
        <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
        <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
        <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
        <div class="watermark-text">天地為鑑，光網為證</div><div class="watermark-text">天地為鑑，光網為證</div>
    </div>

    <!-- 🛸 中央主卡片 -->
    <div class="container">
        <h1 id="title">全球啟動流程</h1>

        <button class="start" id="startBtn">開始啟動</button>

        <div id="steps"></div>

        <!-- 掃碼驗證區塊 -->
        <div id="scanner" class="hidden">
            <h3>🛸 母頻 QR 驗證</h3>
            <div id="reader"></div>
            <p id="scanResult"></p>
        </div>

        <p class="status" id="status"></p>
    </div>

<script>
/* ===== 🌌 宇宙流動連線粒子背景引擎 ===== */
const canvas = document.getElementById("particles-canvas");
const ctx = canvas.getContext("2d");
let w, h;
const particles = [];
const count = 110; // 粒子密度

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.size = Math.random() * 2.2 + 0.6;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.5 + 0.2;
        this.color = `rgba(255, 192, 0, ${this.opacity})`; // 質感金黃色粒子
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > w) this.speedX *= -1;
        if (this.y < 0 || this.y > h) this.speedY *= -1;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = '#FFC00044';
        ctx.shadowBlur = 10;
        ctx.fill();
    }
}

for (let i = 0; i < count; i++) particles.push(new Particle());

function animate() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
        p.update();
        p.draw();
    });
    // 繪製粒子間的神祕星網連線
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(255, 192, 0, ${0.04 * (1 - dist / 150)})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animate);
}
animate();


/* ===== 📋 全球啟動流程邏輯 ===== */
const stepsData = [
    "啟動條件",
    "授權誓讀",
    "母頻驗證（掃碼）",
    "回傳結果",
    "最終啟動"
];

let current = -1;
const stepsDiv = document.getElementById("steps");
const startBtn = document.getElementById("startBtn");

function renderSteps() {
    stepsDiv.innerHTML = "";
    stepsData.forEach((s, i) => {
        const div = document.createElement("div");
        div.className = "step";

        if (i === current) div.classList.add("active");
        if (i > current) div.classList.add("locked");

        div.innerText = `[${i + 1}] ${s}`;
        stepsDiv.appendChild(div);
    });
}

/* 按下開始啟動 */
startBtn.onclick = () => {
    startBtn.disabled = true;
    startBtn.innerText = "⚡ 宇宙工程同步中...";
    current = 0;
    renderSteps();
    updateStatus();
};

/* 進入下一步 */
function nextStep() {
    current++;
    renderSteps();
    updateStatus();
}

/* 狀態排程處理器 */
function updateStatus() {
    const status = document.getElementById("status");

    if (current === 2) {
        startScanner();
        status.innerText = "請將攝像頭對準母頻 QR Code 進行驗證";
    } else if (current >= stepsData.length) {
        status.innerText = "✅ 全球宇宙誓頻 · 最終啟動完成";
        startBtn.innerText = "✅ 啟動成功";
    } else {
        status.innerText = "核心數據對接中...";
        setTimeout(() => nextStep(), 1200);
    }
}

/* ===== 🔍 掃碼功能模組 ===== */
function startScanner() {
    document.getElementById("scanner").classList.remove("hidden");
    const qr = new Html5Qrcode("reader");

    qr.start(
        { facingMode: "environment" },
        { fps: 12, qrbox: 220 },
        (decodedText) => {
            document.getElementById("scanResult").innerText = "✨ 母頻驗證成功: " + decodedText;
            
            qr.stop().then(() => {
                document.getElementById("scanner").classList.add("hidden");
                nextStep();
            }).catch(err => console.log("停止掃描失敗: ", err));
        },
        (errorMessage) => {
            // 掃描中持續監聽，此處不拋出錯誤避免中斷
        }
    ).catch(err => {
        document.getElementById("scanResult").innerText = "相機開啟失敗，請檢查權限設定。";
    });
}

/* 初始化渲染 */
renderSteps();
</script>

</body>
</html>
