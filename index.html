<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【宇宙誓印覺醒工程 · 七印誓網】啟動入口</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', 'Share Tech Mono', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #06122c 0%, #020715 100%);
            min-height: 100vh;
            color: #e0e8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(8px, 2vh, 24px);
        }

        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(#d4af37, rgba(212, 175, 55, .3) 1px, transparent 30px),
                radial-gradient(#d4af37, rgba(212, 175, 55, .2) 2px, transparent 40px);
            background-size: 350px 350px, 450px 450px;
            background-position: 0 0, 90px 150px;
            animation: starMove 90s linear infinite;
            opacity: 0.65;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes starMove {
            from {
                transform: translateY(0px) rotate(0deg);
            }
            to {
                transform: translateY(-1000px) rotate(360deg);
            }
        }

        .hud-container {
            width: 100%;
            max-width: min(1200px, 98vw);
            background: rgba(4, 13, 33, 0.4);
            border: 1.5px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.15), inset 0 0 20px rgba(168, 85, 247, 0.05);
            border-radius: clamp(16px, 4vw, 28px);
            padding: clamp(16px, 3vh, 36px);
            position: relative;
            z-index: 10;
        }

        .hud-container::after {
            content: "";
            position: absolute;
            top: 18px;
            right: 18px;
            width: 14px;
            height: 14px;
            border-top: 3px solid #a78bfa;
            border-right: 3px solid #a78bfa;
            pointer-events: none;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: clamp(1.2rem, 3.2vh, 2rem);
            font-weight: 700;
            color: #e9d5ff;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            letter-spacing: 2px;
            line-height: 1.4;
        }

        .header h1 i {
            color: #a78bfa;
            margin-right: 8px;
        }

        .header .sub {
            color: #c4b5fd;
            font-size: clamp(0.7rem, 1.6vh, 0.95rem);
            margin-top: 8px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .header .sub i {
            color: #d4af37;
            margin-right: 6px;
        }

        .lang-switch-group {
            display: flex;
            justify-content: center;
            gap: 0;
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 24px;
            padding: 3px;
            margin-top: 14px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: rgba(224, 232, 245, 0.4);
            font-size: clamp(0.5rem, 1.2vh, 0.8rem);
            padding: clamp(4px, 0.8vh, 8px) clamp(14px, 2vw, 28px);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .lang-btn.active {
            background: #7c3aed;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(124, 58, 237, 0.5);
        }

        /* 模組標題分隔 */
        .module-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 28px 0 16px 0;
            padding: 12px 0;
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
        }

        .module-divider .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(168, 85, 247, 0.3), transparent);
        }

        .module-divider .label {
            font-size: clamp(0.8rem, 1.8vh, 1.1rem);
            font-weight: 700;
            color: #d4b68a;
            letter-spacing: 2px;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(212, 182, 138, 0.15);
            padding: 0 16px;
        }

        .module-divider .label i {
            color: #d4af37;
            margin-right: 8px;
        }

        .module-divider .label.en {
            color: #a78bfa;
        }

        .module-divider .label.en i {
            color: #a78bfa;
        }

        .table-wrap {
            background: rgba(18, 16, 23, 0.5);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 16px;
            overflow-x: auto;
            padding: 4px 0;
            backdrop-filter: blur(2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(0.6rem, 1.3vh, 0.85rem);
            min-width: 800px;
        }

        th {
            background: rgba(88, 28, 135, 0.35);
            color: #d4b68a;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 12px 10px;
            text-align: left;
            border-bottom: 2px solid rgba(168, 85, 247, 0.25);
            font-size: clamp(0.5rem, 1vh, 0.7rem);
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        td {
            padding: 10px 10px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.06);
            vertical-align: middle;
            line-height: 1.5;
            color: #e0e8f5;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(124, 58, 237, 0.06);
        }

        .col-segment {
            width: 14%;
            color: #c4b5fd;
            font-weight: 400;
            font-size: clamp(0.5rem, 1.1vh, 0.7rem);
            border-left: 3px solid transparent;
            padding-left: 10px;
        }

        .col-no {
            width: 10%;
            text-align: center;
            color: #a78bfa;
            font-weight: 600;
            font-size: clamp(0.5rem, 1.1vh, 0.75rem);
        }

        .col-link {
            width: 8%;
            text-align: center;
        }

        .col-field {
            width: 28%;
            color: #f0e9f1;
            font-weight: 400;
            font-size: clamp(0.55rem, 1.2vh, 0.8rem);
        }

        .col-func {
            width: 40%;
            color: #d0d8e8;
            font-weight: 300;
            font-size: clamp(0.5rem, 1.1vh, 0.75rem);
        }

        .unit-link {
            display: inline-block;
            background: transparent;
            border: 1px solid rgba(168, 85, 247, 0.35);
            color: #c4b5fd;
            padding: 3px 12px;
            border-radius: 40px;
            font-size: clamp(0.45rem, 1vh, 0.65rem);
            text-decoration: none;
            letter-spacing: 1px;
            transition: 0.25s ease;
            white-space: nowrap;
            font-weight: 500;
        }

        .unit-link:hover {
            background: #d4b68a;
            color: #0b0a0f;
            border-color: #d4b68a;
            box-shadow: 0 0 24px rgba(212, 182, 138, 0.15);
            transform: scale(1.02);
        }

        .unit-link i {
            margin-left: 4px;
        }

        .footer-note {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid rgba(168, 85, 247, 0.1);
            padding-top: 18px;
        }

        .footer-note .page-info {
            display: block;
            color: #8a7e6b;
            font-size: clamp(0.45rem, 0.9vh, 0.65rem);
            letter-spacing: 1px;
        }

        .footer-note .page-info i {
            color: #d4af37;
            margin-right: 4px;
        }

        @media (max-width: 768px) {
            .hud-container {
                padding: 10px;
            }
            table {
                min-width: 600px;
                font-size: 0.6rem;
            }
            .col-segment {
                width: 12%;
            }
            .col-field {
                width: 24%;
            }
            .col-func {
                width: 36%;
            }
            .col-link {
                width: 8%;
            }
            .unit-link {
                padding: 2px 8px;
                font-size: 0.5rem;
            }
            th,
            td {
                padding: 6px 6px;
            }
            .module-divider .label {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 480px) {
            .hud-container {
                padding: 6px;
            }
            table {
                min-width: 480px;
                font-size: 0.5rem;
            }
            .unit-link {
                padding: 2px 6px;
                font-size: 0.45rem;
            }
            .col-segment {
                width: 10%;
            }
            .col-field {
                width: 22%;
            }
            .col-func {
                width: 34%;
            }
            .col-link {
                width: 8%;
            }
            th,
            td {
                padding: 4px 4px;
            }
            .module-divider .label {
                font-size: 0.6rem;
                padding: 0 8px;
            }
        }
    </style>
</head>

<script>
    (function() {
        // 在標頭區加入外部瀏覽器按鈕
        function addExternalBrowserButton() {
            var langGroup = document.querySelector('.lang-switch-group');
            if (!langGroup) {
                console.warn('⚠️ 找不到 .lang-switch-group');
                return;
            }

            if (document.querySelector('.btn-external-browser')) return;

            var btn = document.createElement('a');
            btn.className = 'btn-external-browser';
            btn.href = '#';
            btn.setAttribute('role', 'button');
            btn.innerHTML = '<i class="fa-solid fa-arrow-up-right-from-square"></i> <span>🌐 瀏覽器開啟</span>';

            btn.addEventListener('click', function(e) {
                e.preventDefault();
                openInExternalBrowser();
            });

            langGroup.parentNode.insertBefore(btn, langGroup.nextSibling);
            console.log('✅ 外部瀏覽器按鈕已新增');
        }

        // 強制開啟外部瀏覽器
        function openInExternalBrowser() {
            var url = window.location.href;
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // Android 使用 intent:// 強制跳轉 Chrome
            if (/android/i.test(userAgent)) {
                try {
                    var intentUrl = 'intent://' + window.location.host + window.location.pathname + window.location.search + '#Intent;scheme=https;package=com.android.chrome;end;';
                    window.location.href = intentUrl;
                    console.log('✅ Android: 嘗試強制跳轉 Chrome');
                    return;
                } catch (e) {
                    console.warn('⚠️ intent 跳轉失敗，嘗試備用方法');
                }
            }

            // iOS 嘗試用 chrome:// 協定
            if (/iphone|ipad|ipod/i.test(userAgent)) {
                try {
                    var chromeUrl = 'chrome://' + window.location.host + window.location.pathname + window.location.search;
                    window.location.href = chromeUrl;
                    console.log('✅ iOS: 嘗試強制跳轉 Chrome');
                    return;
                } catch (e) {
                    console.warn('⚠️ chrome:// 跳轉失敗');
                }
            }

            // 備用方法：複製網址並提示
            var fallbackUrl = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fallbackUrl).then(function() {
                    alert('⚠️ 無法自動跳轉外部瀏覽器\n\n📋 網址已複製，請手動貼到 Chrome / Safari 開啟：\n\n' + fallbackUrl);
                }).catch(function() {
                    fallbackCopy(fallbackUrl);
                });
            } else {
                fallbackCopy(fallbackUrl);
            }
        }

        // 複製網址備用方法
        function fallbackCopy(text) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                alert('⚠️ 無法自動跳轉外部瀏覽器\n\n📋 網址已複製，請手動貼到 Chrome / Safari 開啟：\n\n' + text);
            } catch (e) {
                alert('⚠️ 請手動複製以下網址，貼到外部瀏覽器開啟：\n\n📋 ' + text);
            }
            document.body.removeChild(textarea);
        }

        if (document.readyState === 'complete') {
            setTimeout(addExternalBrowserButton, 100);
        } else {
            window.addEventListener('load', function() {
                setTimeout(addExternalBrowserButton, 200);
            });
        }
    })();
</script>

<script>
(function () {
    if (window.__fixStep13Link) return;
    window.__fixStep13Link = true;

    function isTargetRow(text) {
        text = (text || '').replace(/\s+/g, ' ');
        return (
            (text.indexOf('第13項') !== -1 || text.indexOf('第 13 項') !== -1 || text.indexOf('Item 13') !== -1) &&
            (
                text.indexOf('誓資紀錄') !== -1 ||
                text.indexOf('回源願書') !== -1 ||
                text.indexOf('不再入世') !== -1 ||
                text.indexOf('不入轉生') !== -1 ||
                text.indexOf('Return-to-Source') !== -1 ||
                text.indexOf('No Further Incarnation') !== -1 ||
                text.indexOf('No Rebirth') !== -1
            )
        );
    }

    function apply() {
        // 1) 表格列
        document.querySelectorAll('tr').forEach(function (row) {
            var rowText = row.textContent || '';
            if (!isTargetRow(rowText)) return;

            row.querySelectorAll('a, button, span, div').forEach(function (el) {
                var t = (el.textContent || '').replace(/\s+/g, ' ').trim();
                var isEnter =
                    t === '進入 →' || t === '進入->' || t === '進入' ||
                    t.indexOf('進入') !== -1 || t.indexOf('Enter') !== -1 ||
                    (el.classList && el.classList.contains('unit-link'));

                if (!isEnter && el.tagName !== 'A') return;

                if (el.tagName === 'A') {
                    el.setAttribute('href', 'step13.html');
                    el.style.pointerEvents = 'auto';
                    el.style.cursor = 'pointer';
                } else {
                    el.style.cursor = 'pointer';
                    el.style.pointerEvents = 'auto';
                    el.onclick = function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        location.href = 'step13.html';
                    };
                    var parentA = el.closest('a');
                    if (parentA) {
                        parentA.setAttribute('href', 'step13.html');
                        parentA.style.pointerEvents = 'auto';
                    }
                }
            });

            // 整列點擊備援
            row.style.cursor = 'pointer';
            if (!row.__step13Bound) {
                row.__step13Bound = true;
                row.addEventListener('click', function (e) {
                    if (e.target && e.target.closest('a')) return;
                    location.href = 'step13.html';
                });
            }
        });

        // 2) 資料陣列 link 也改
        if (typeof level2Data !== 'undefined') {
            ['zh', 'en'].forEach(function (lang) {
                var items = level2Data[lang] && level2Data[lang].items;
                if (!items) return;
                items.forEach(function (it) {
                    var blob = (it.no || '') + ' ' + (it.field || '') + ' ' + (it.func || '');
                    if (isTargetRow(blob) || /第13項|Item 13|誓資紀錄|回源願書/i.test(blob)) {
                        it.link = 'step13.html';
                    }
                });
            });
        }
    }

    function run() {
        apply();
        setTimeout(apply, 150);
        setTimeout(apply, 500);
        setTimeout(apply, 1200);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', run);
    } else {
        run();
    }

    var orig = window.switchLanguage;
    if (typeof orig === 'function') {
        window.switchLanguage = function (l) {
            orig(l);
            setTimeout(apply, 80);
            setTimeout(apply, 300);
        };
    }

    console.log('✅ 第13項 → step13.html');
})();

<script>

    var MAP = [
        { keys: ['第0項', 'Item 0', '購書序號', 'Purchase Serial'], href: 'step0.html' },

        { keys: ['第4項', 'Item 4', '誓魂本族', 'Origin Claim', '天族姓脈'], href: 'step4.html' },
        { keys: ['第5項', 'Item 5', '宇宙總位標', 'Master Coordinate', '維度階級'], href: 'step5.html' },
        { keys: ['第6項', 'Item 6', '覺醒程度', 'Awakening Level'], href: 'step6.html' },

        { keys: ['第16項', 'Item 16', '對頻歷程摘要', 'Process Summary', 'Key Frequency-Alignment Proces'], href: 'step16.html' }
    ];

    function matchHref(text) {
        text = (text || '').replace(/\s+/g, ' ');
        // 先比對較長／較特殊的（未通過、各印）再比對一般項
        for (var i = 0; i < MAP.length; i++) {
            var m = MAP[i];
            for (var k = 0; k < m.keys.length; k++) {
                if (text.indexOf(m.keys[k]) !== -1) return m.href;
            }
        }
        return null;
    }

    function apply() {
        // 同步資料陣列
        ['level1Data', 'level2Data'].forEach(function (name) {
            var data = window[name];
            if (!data) return;
            ['zh', 'en'].forEach(function (lang) {
                var items = data[lang] && data[lang].items;
                if (!items) return;
                items.forEach(function (it) {
                    var blob = [it.no, it.field, it.func, it.segment].join(' ');
                    var href = matchHref(blob);
                    if (href) it.link = href;
                });
            });
        });

        // 表格每一列
        document.querySelectorAll('tr').forEach(function (row) {

                a.style.cursor = 'pointer';

            // 非 a 的「進入」文字
            row.querySelectorAll('button, span, div').forEach(function (el) {
                var t = (el.textContent || '').replace(/\s+/g, ' ').trim();

                el.style.cursor = 'pointer';
                el.style.pointerEvents = 'auto';
                el.onclick = function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    location.href = href;
                };
            });
        });
    }

    function run() {
        apply();
        setTimeout(apply, 150);
        setTimeout(apply, 500);
        setTimeout(apply, 1200);
    }

    if (document.readyState === 'loading') {

    var orig = window.switchLanguage;

        window.switchLanguage = function (l) {

            setTimeout(apply, 80);
            setTimeout(apply, 300);
        };
    }

})();
</script>
