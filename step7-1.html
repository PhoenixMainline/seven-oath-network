<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【宇宙誓印覺醒工程 · 七印誓網】第一印 × 消業印</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', 'Share Tech Mono', sans-serif; }
        body {
            background: radial-gradient(circle at 50% 50%, #06122c 0%, #020715 100%);
            min-height: 100vh;
            color: #e0e8f5;
            display: flex; justify-content: center; align-items: center;
            padding: clamp(4px, 1.5vh, 16px);
            position: relative;
        }
        .particle-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: radial-gradient(#d4af37, rgba(212, 175, 55, .3) 1px, transparent 30px), radial-gradient(#d4af37, rgba(212, 175, 55, .2) 2px, transparent 40px);
            background-size: 350px 350px, 450px 450px;
            background-position: 0 0, 90px 150px;
            animation: starMove 90s linear infinite; opacity: 0.65; z-index: 5; pointer-events: none;
        }
        @keyframes starMove { from { transform: translateY(0px) rotate(0deg); } to { transform: translateY(-1000px) rotate(360deg); } }
        .watermark-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; opacity: 0.04;
            display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); padding: 50px;
        }
        .watermark-text { font-size: 1.5rem; font-weight: bold; color: #ffffff; transform: rotate(-25deg); white-space: nowrap; user-select: none; }
        .hud-container {
            width: 100%; max-width: min(660px, 95vw);
            background: rgba(4, 13, 33, 0.4);
            border: 1.5px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.15), inset 0 0 20px rgba(168, 85, 247, 0.05);
            border-radius: clamp(16px, 4vw, 28px);
            padding: clamp(8px, 1.5vh, 20px);
            display: flex; flex-direction: column; position: relative; z-index: 3; margin: auto;
        }
        .hud-container::after { content: ""; position: absolute; top: 18px; right: 18px; width: 14px; height: 14px; border-top: 3px solid #a78bfa; border-right: 3px solid #a78bfa; pointer-events: none; }
        .home-breadcrumb { font-size: clamp(0.6rem, 1.4vh, 0.85rem); color: #c4b5fd; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; font-weight: bold; align-self: flex-start; transition: all 0.3s ease; text-shadow: 0 0 8px rgba(168, 85, 247, 0.4); position: relative; z-index: 1000; pointer-events: auto !important; }
        .home-breadcrumb:hover { color: #e9d5ff; text-shadow: 0 0 12px rgba(168, 85, 247, 0.6); transform: translateX(-2px); }
        .hud-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(168, 85, 247, 0.2); padding-bottom: clamp(8px, 1.5vh, 18px); margin-bottom: clamp(8px, 1.5vh, 25px); flex-shrink: 0; }
        .app-title { font-size: clamp(0.9rem, 2.2vh, 1.15rem); font-weight: 700; color: #e9d5ff; text-shadow: 0 0 12px rgba(168, 85, 247, 0.5); max-width: 75%; line-height: 1.4; }
        .lang-switch-group { display: flex; background: rgba(124, 58, 237, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 20px; padding: 2px; z-index: 10; }
        .lang-btn { background: transparent; border: none; color: rgba(224, 232, 245, 0.4); font-size: clamp(0.5rem, 1.2vh, 0.75rem); padding: clamp(2px, 0.6vh, 5px) clamp(6px, 1vw, 12px); border-radius: 16px; cursor: pointer; transition: all 0.2s ease; }
        .lang-btn.active { background: #7c3aed; color: #ffffff; font-weight: bold; box-shadow: 0 0 12px rgba(124, 58, 237, 0.5); }

        .step-content { flex: 1 1 auto; display: flex; flex-direction: column; gap: clamp(8px, 1.5vh, 22px); overflow-y: auto; padding-right: 4px; min-height: 0; }
        .step-panel { display: flex; flex-direction: column; gap: 20px; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .hud-card {
            background: linear-gradient(135deg, rgba(88, 28, 135, 0.5), rgba(30, 27, 75, 0.6));
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: clamp(10px, 2vw, 16px);
            padding: clamp(10px, 2vh, 24px) clamp(10px, 2vw, 24px);
        }
        .card-title { font-size: clamp(0.9rem, 2vh, 1.2rem); color: #e9d5ff; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
        .card-title i { color: #a78bfa; }
        .instruction-box { display: flex; flex-direction: column; gap: 12px; }
        .instruction-item { font-size: clamp(0.7rem, 1.6vh, 0.95rem); line-height: 1.6; color: rgba(224, 232, 245, 0.85); display: flex; align-items: flex-start; gap: clamp(6px, 1vw, 12px); }
        .instruction-item i { color: #a78bfa; margin-top: 5px; }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(0.7rem, 1.4vh, 0.85rem);
            background: rgba(88, 28, 135, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 8px;
            overflow: hidden;
        }
        .info-table th {
            background: rgba(88, 28, 135, 0.5);
            color: #e9d5ff;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 2px solid rgba(168, 85, 247, 0.4);
            font-weight: 600;
        }
        .info-table td {
            padding: 10px 12px;
            color: #e0e7ff;
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
            vertical-align: top;
        }
        .info-table tr:last-child td { border-bottom: none; }

        .hud-footer { flex-shrink: 0; margin-top: auto; padding-top: clamp(6px, 1vh, 12px); border-top: 1px solid rgba(168, 85, 247, 0.2); display: flex; justify-content: space-between; align-items: center; z-index: 10; flex-wrap: wrap; }
        .footer-btn-group { display: flex; align-items: center; gap: clamp(4px, 1vw, 12px); }
        .btn-action {
            background: transparent; border: 1px solid rgba(168, 85, 247, 0.2); color: rgba(168, 85, 247, 0.3);
            padding: clamp(6px, 1.2vh, 10px) clamp(10px, 1.5vw, 22px);
            font-size: clamp(0.65rem, 1.3vh, 0.9rem); border-radius: 20px;
            display: inline-flex; align-items: center; gap: 8px;
            transition: all 0.3s ease; text-decoration: none; min-height: clamp(32px, 5vh, 44px);
        }
        .btn-action.enabled { border: 1px solid #a78bfa; color: #e9d5ff; cursor: pointer; pointer-events: auto; background: rgba(124, 58, 237, 0.15); text-shadow: 0 0 10px rgba(167, 139, 250, 0.6); box-shadow: 0 0 15px rgba(124, 58, 237, 0.3); }
        .btn-action.enabled:hover { background: rgba(124, 58, 237, 0.28); box-shadow: 0 0 25px rgba(124, 58, 237, 0.5); transform: translateY(-1px); }
        .page-marker { font-size: clamp(0.5rem, 1.2vh, 0.78rem); color: rgba(224, 232, 245, 0.35); display: flex; align-items: center; gap: 6px; }

        .hud-dialog { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 17, 0.85); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; }
        .hud-dialog.active { display: flex; opacity: 1; }
        .hud-dialog-content { background: rgba(4, 13, 33, 0.95); border: 1.5px solid #a78bfa; box-shadow: 0 0 30px rgba(124, 58, 237, 0.4); border-radius: 18px; padding: 30px; max-width: 420px; width: 90%; text-align: center; }
        .hud-dialog-text { font-size: 1rem; line-height: 1.6; margin-bottom: 20px; color: #e0e8f5; }
        .hud-dialog-btn { background: transparent; border: 1px solid #a78bfa; color: #e9d5ff; padding: 8px 24px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; text-shadow: 0 0 8px rgba(167, 139, 250, 0.5); transition: all 0.2s; }
        .hud-dialog-btn:hover { background: rgba(124, 58, 237, 0.15); box-shadow: 0 0 15px rgba(124, 58, 237, 0.3); }

        .qr-result { color: #00e676; font-size: 0.9rem; padding: 8px 16px; border-radius: 20px; background: rgba(0, 230, 118, 0.08); border: 1px solid rgba(0, 230, 118, 0.2); word-break: break-all; }
        .camera-guide { background: rgba(232, 96, 74, 0.08); border-left: 4px solid #E8604A; padding: 14px 16px; border-radius: 12px; color: #e0dcc8; font-size: 0.85rem; line-height: 1.8; white-space: pre-wrap; text-align: left; display: none; }
        #qr-reader-container-step8 video, #qr-reader-container-step9 video { border-radius: 12px; width: 100%; }

        .center-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .center-card .card-title { justify-content: center; }
        .center-card .instruction-box { align-items: center; }
        .center-card .instruction-item { text-align: left; max-width: 100%; width: 100%; justify-content: flex-start; }
        .center-card .qr-result,
        .center-card .camera-guide { text-align: left; }
        .center-card #qr-reader-container-step8,
        .center-card #qr-reader-container-step9 { margin: 0 auto; }

        .en { display: none; }
        body.lang-en .zh { display: none; }
        body.lang-en .en { display: block; }

        /* 計時器 */
        .timer-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: clamp(6px, 1vh, 12px);
            padding: clamp(12px, 2vh, 20px);
            background: rgba(124, 58, 237, 0.18);
            border: 1px dashed rgba(168, 85, 247, 0.55);
            border-radius: 14px;
        }
        .timer-label { font-size: clamp(0.7rem, 1.4vh, 1rem); color: #c4b5fd; min-width: clamp(50px, 8vw, 80px); }
        .timer-number {
            font-size: clamp(3rem, 8vh, 4.5rem);
            font-family: 'Share Tech Mono', sans-serif;
            color: #a78bfa;
            text-shadow: 0 0 25px rgba(167, 139, 250, 0.6);
            font-weight: 700;
            text-align: center;
            min-width: clamp(50px, 8vw, 80px);
        }
        .timer-number.complete { color: #00e676; text-shadow: 0 0 30px rgba(0, 230, 118, 0.6); }
        .btn-start-centering {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            border: none; color: #ffffff; font-weight: 800;
            padding: clamp(8px, 1.2vh, 14px) clamp(18px, 2.5vw, 38px);
            font-size: clamp(0.8rem, 1.6vh, 1.05rem);
            border-radius: clamp(20px, 3vw, 40px);
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-start-centering:hover { transform: scale(1.03); box-shadow: 0 6px 30px rgba(124, 58, 237, 0.6); }
        .btn-start-centering:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-restart {
            background: rgba(124, 58, 237, 0.25);
            border: none; color: #ffffff; font-weight: 800;
            padding: clamp(6px, 1vh, 10px) clamp(14px, 2vw, 28px);
            font-size: clamp(0.7rem, 1.3vh, 0.9rem);
            border-radius: clamp(16px, 2vw, 30px);
            cursor: pointer; transition: all 0.3s ease;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-restart:hover { background: rgba(124, 58, 237, 0.4); }

        .proclamation-text {
            font-size: clamp(1rem, 2.5vh, 1.3rem);
            color: #fde68a;
            font-weight: bold;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 14px;
            padding: 4px 6px;
            text-shadow: 0 0 15px rgba(253, 230, 138, 0.3);
        }

        /* 提交表單 */
        .form-submit-container {
            margin-top: 20px;
            padding: 24px 20px;
            background: rgba(4, 13, 33, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 16px;
            width: 100%;
        }
        .form-submit-container .form-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e9d5ff;
            text-align: center;
            margin-bottom: 18px;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }
        .form-section-title {
            font-weight: 600;
            color: #c4b5fd;
            margin: 14px 0 10px 0;
            font-size: 0.9rem;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.1);
        }
        .form-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .form-row label {
            min-width: 130px;
            color: #c4b5fd;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .form-row input,
        .form-row select,
        .form-row textarea {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            color: #e0e8f5;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-row input:focus,
        .form-row select:focus,
        .form-row textarea:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.15);
        }
        .form-row select option { background: #0b0f1a; color: #e0e8f5; }
        .form-row textarea { resize: vertical; min-height: 44px; }
        .form-row .hint { color: #8a7e6b; font-size: 0.7rem; font-style: italic; min-width: 120px; }

        .form-actions {
            display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap;
        }
        .form-actions button {
            padding: 10px 28px; border-radius: 24px; border: none; font-size: 0.9rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-preview {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }
        .btn-preview:hover { transform: scale(1.03); box-shadow: 0 6px 30px rgba(124, 58, 237, 0.6); }
        .btn-reset {
            background: rgba(124, 58, 237, 0.15);
            color: #e9d5ff;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        .btn-reset:hover { background: rgba(124, 58, 237, 0.3); }

        .preview-submit-container {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(168, 85, 247, 0.2);
            border-radius: 12px;
            width: 100%;
        }
        .preview-submit-container .preview-header {
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            color: #fde68a;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(253, 230, 138, 0.2);
        }
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            background: rgba(18, 16, 23, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 8px;
            overflow: hidden;
        }
        .preview-table th {
            background: rgba(88, 28, 135, 0.35);
            color: #d4b68a;
            font-weight: 600;
            padding: 8px 10px;
            text-align: left;
            border-bottom: 2px solid rgba(168, 85, 247, 0.2);
            font-size: 0.7rem;
            text-transform: uppercase;
        }
        .preview-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.06);
            color: #e0e8f5;
            vertical-align: top;
            line-height: 1.5;
        }
        .preview-table tr:last-child td { border-bottom: none; }
        .preview-table .label-cell { color: #c4b5fd; font-weight: 400; width: 22%; }
        .preview-table .value-cell { color: #f0e9f1; width: 38%; }
        .preview-table .section-header { background: rgba(88, 28, 135, 0.2); color: #e9d5ff; font-weight: 600; text-align: center; }
        .capture-hint {
            text-align: center; margin-top: 14px; padding: 12px;
            background: rgba(0, 230, 118, 0.05); border: 1px dashed rgba(0, 230, 118, 0.2);
            border-radius: 8px; color: #8a7e6b; font-size: 0.8rem;
        }
        .capture-hint i { color: #00e676; margin-right: 6px; }

        @media (max-width: 480px) {
            body { padding: 4px !important; }
            .hud-container { padding: 8px 6px !important; border-radius: 12px !important; }
            .hud-header { margin-bottom: 6px !important; padding-bottom: 4px !important; }
            .hud-footer { margin-top: 8px !important; padding-top: 6px !important; }
            .form-row { flex-direction: column; align-items: stretch; }
            .form-row label { min-width: auto; }
            .form-row input, .form-row select, .form-row textarea { min-width: auto; }
            .form-row .hint { min-width: auto; }
            .preview-table { font-size: 0.65rem; }
            .preview-table td, .preview-table th { padding: 4px 6px; }
        }
    </style>
</head>
<body>
    <div class="particle-container"></div>
    <div class="watermark-layer">
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
        <div class="watermark-text">天地為鑑・光網為證</div>
    </div>
    <div class="hud-container">
        <a class="home-breadcrumb" id="homeBtn" href="index.html"><i class="fa-solid fa-house"></i><span id="homeBtnText">首頁 -></span></a>
        <header class="hud-header">
            <div class="app-title" id="appTitle">【宇宙誓印覺醒工程 · 七印誓網】</div>
            <div class="lang-switch-group">
                <button class="lang-btn active" onclick="switchLanguage('zh')">中文</button>
                <button class="lang-btn" onclick="switchLanguage('en')">English</button>
            </div>
        </header>

        <main class="step-content">
            <!-- ===== 第7項 第一印 × 消業印 完整內容 ===== -->
            <div class="step-panel active" id="panelStep7_1">

                <!-- 標題卡 -->
                <div class="hud-card" style="background:linear-gradient(135deg,rgba(88,28,135,0.5),rgba(30,27,75,0.6)); border:1px solid rgba(168,85,247,0.5);">
                    <div style="text-align:center; color:#e9d5ff; font-size:1.05rem; font-weight:bold; margin-bottom:16px; letter-spacing:1px;"><span id="step7_1Title">🔥 第一印 × 消業印</span></div>
                    <div style="text-align:center; margin-bottom:14px;">
                        <div style="color:#fbbf24; font-size:0.95rem; font-weight:bold; margin-bottom:6px;"><i class="fa-solid fa-bolt" style="margin-right:6px;"></<!-- ============================================================ -->
<!-- 統一：兩句圖示與文字強制同一列（不換行、不分離）              -->
<!-- 1. 送出即啟主頻連線，判定授權完成 → 誓印對頻律網顯化。      -->
<!-- 2. 【觸發指令】為正式天令格式，誓印者須照文輸入，不可更動。  -->
<!-- ============================================================ -->
<style>
    .hud-card [id*="Note"],
    .hud-card [id*="Success"],
    .hud-card [id*="Trigger"],
    .hud-card [id*="trigger"],
    .camera-guide,
    .hud-card div[style*="border-left"] {
        display: flex !important;
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        align-items: flex-start !important;
        justify-content: flex-start !important;
        gap: 8px !important;
        width: 100% !important;
        text-align: left !important;
        box-sizing: border-box !important;
    }

    .hud-card [id*="Note"] i,
    .hud-card [id*="Success"] i,
    .hud-card [id*="Trigger"] i,
    .hud-card [id*="trigger"] i,
    .camera-guide i,
    .hud-card div[style*="border-left"] i {
        flex-shrink: 0 !important;
        margin: 0 !important;
        margin-top: 3px !important;
        line-height: 1 !important;
    }
</style>

<script>
(function () {
    var KEYWORDS = [
        // 第一句
        '送出即啟主頻連線',
        '判定授權完成',
        '誓印對頻律網顯化',
        'Primary Frequency Link',
        'authorization is recognized',
        'Oath-Seal Alignment Network',
        // 第二句
        '觸發指令',
        '正式天令格式',
        '須照文輸入',
        '不可更動',
        'Trigger Command',
        'Heavenly Decree',
        'without modification',
        'must input exactly'
    ];

    function unifySameLine() {
        var nodes = document.querySelectorAll(
            '.hud-card div, .instruction-item, .instruction-box div, .camera-guide, [id*="Note"], [id*="Success"], [id*="Trigger"], [id*="trigger"]'
        );

        nodes.forEach(function (el) {
            var text = (el.textContent || '').trim();
            if (!text) return;

            var hit = KEYWORDS.some(function (k) { return text.indexOf(k) !== -1; });
            if (!hit) return;

            // 本層：橫向排列
            el.style.setProperty('display', 'flex', 'important');
            el.style.setProperty('flex-direction', 'row', 'important');
            el.style.setProperty('flex-wrap', 'nowrap', 'important');
            el.style.setProperty('align-items', 'flex-start', 'important');
            el.style.setProperty('justify-content', 'flex-start', 'important');
            el.style.setProperty('gap', '8px', 'important');
            el.style.setProperty('width', '100%', 'important');
            el.style.setProperty('text-align', 'left', 'important');

            // 子元素：圖示不縮小、文字可換行但不與圖示分行成兩塊
            Array.prototype.forEach.call(el.children, function (child) {
                var isIcon = child.tagName === 'I' ||
                    (child.className && String(child.className).indexOf('fa-') !== -1);
                if (isIcon) {
                    child.style.setProperty('flex-shrink', '0', 'important');
                    child.style.setProperty('margin', '0', 'important');
                    child.style.setProperty('margin-top', '3px', 'important');
                    child.style.setProperty('display', 'inline-block', 'important');
                } else {
                    child.style.setProperty('display', 'inline', 'important');
                    child.style.setProperty('white-space', 'normal', 'important');
                    child.style.setProperty('flex', '1 1 auto', 'important');
                }
            });

            // 父層若為置中 flex，改靠左
            var parent = el.parentElement;
            if (parent) {
                parent.style.setProperty('text-align', 'left', 'important');
                parent.style.setProperty('align-items', 'flex-start', 'important');
                parent.style.setProperty('justify-content', 'flex-start', 'important');
            }
        });
    }

    function run() {
        unifySameLine();
        setTimeout(unifySameLine, 120);
        setTimeout(unifySameLine, 400);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', run);
    } else {
        run();
    }

    // 語系切換後再套一次
    var orig = window.switchLanguage;
    if (typeof orig === 'function') {
        window.switchLanguage = function (lang) {
            orig(lang);
            setTimeout(unifySameLine, 60);
            setTimeout(unifySameLine, 200);
        };
    }

    // 動態內容變動時補跑
    var observer = new MutationObserver(function () {
        clearTimeout(window.__unifySameLineTimer);
        window.__unifySameLineTimer = setTimeout(unifySameLine, 80);
    });
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });

    console.log('✅ 兩句圖示與文字已統一強制同一列');
})();
</script>
